ARCHITECTURE NOTES - MLX Ink (Tauri 2 + WebView2 desktop app; the same file also runs in a plain browser with npm run dev)
Keep this block short and true: change the code, then the notes, then append to the CHANGELOG at the bottom.
Keep this block right after <meta charset> and ASCII only: encoding is sniffed in the first 1024 bytes. Line numbers drift, so none are listed. Search for the section comments named below (they start with a slash-star and dashes).

FILES
  src-tauri/src/vault.rs   disk store commands for Vault (see STORAGE AND SAVING); needs mod vault + generate_handler entries and a rebuild. src/desktop.ts also changed (close flush, fresh-profile check).
  index.html          the whole app: <style>, markup, then ONE script wrapped in an IIFE (nothing is global except what desktop.ts reads).
  src/fonts.css       Courier Prime. src/fonts-script.css + src/fonts/*.woff: the TeX Gyre faces of the script font picker (licence file in src/fonts).
                      src-tauri/src/fonts.rs: list_system_fonts command (installed font names). src/desktop.ts: window.mlxDesktop.saveText (native Save dialog), checkForUpdates
                      (signed desktop updater), and a mirror of every
                      localStorage key starting with "klapka." to files on disk. src-tauri: tauri.conf.json (strict CSP), capabilities.
  Interface language: see INTERFACE LANGUAGE below. prefs.lang is the PROOFING (spell-check) language only. SCRIPT labels follow prefs.vocab: see SCRIPT VOCABULARY below.

STATE
  The script text lives in the DOM: #editor children are div.el[data-t=TYPE] (TYPE in ALL; EXTRA = cast, pagebreak, synopsis, note, alt, beat).
  blocksData() serializes to [[type, text], ...]; bold/italic/underline are stored as marks (** * _) inside the text (toMarks/fromMarks).
  prefs = one object: the keys in DOCK_ are saved PER SCRIPT (format, nums, tp, wm, hf, rev, hide, lang, lock, ...); all others are UI prefs.
  P = the open script (see STORAGE), IDX = index of all scripts, F = active format, cur = current block, H/hi = undo history (commit, snap).
  Derived, never saved: pagesN, lastPos, scenesInfo, charsInfo (rebuilt by layout() and after()).
  Render path after an edit: touch()/relayout() -> layout() -> after() (stats, navigator) -> debounced store().

STORAGE AND SAVING (sections "projects library", "vault", "document model", "migration")
  VAULT: Vault holds every klapka.* key in memory (sync reads) and writes to localStorage plus, in the desktop build, to disk through the Rust commands
  vault_status/list/get/put/del (src-tauri/src/vault.rs, files in <app data>/mlx-vault/<key>.json: atomic tmp+rename, .bak copy, truncated-file fallback).
  On desktop the DISK copy is primary and localStorage is a best-effort mirror (a full localStorage is harmless there); without the commands
  (plain browser, or an old build) it is localStorage only. Disk writes are queued, coalesced per key, retried every few seconds, and a toast warns
  when the disk refuses. At start the newer copy of each key wins (rev, then updated) and the older side is healed. A key whose localStorage write
  failed is marked dirty and retried (Vault.dirty). klapka.bak.* keys are files only, never loaded. src/desktop.ts still mirrors every klapka.* key that fits
  in localStorage to its own files (second safety net, commands store_set/store_remove/store_load_all); on close it also waits for window.mlxInkFlush (Vault).
  Keys: klapka.idx (home index, derived), klapka.proj.<id> (one project, schema 3), klapka.ui, klapka.mig (migration register), klapka.p.<id> (OLD flat records,
  read only by the migration), klapka.v1 / klapka.snaps (oldest format, migrated once in boot(), IDX.migrated). Never rename or drop a key without a migration.
  store() runs 700 ms after the last change (sTimer): saveProject() -> Docs.write(); markDirty()/setSaved() drive the save dot. Docs.write bumps rev only
  when the serialized project changed. Export and import of a project file stays the user's own backup (quota() warns in browser mode).

DOCUMENT MODEL (schema 3; section "document model")
  Project = {schema,kind,id,rev,created,updated,title,logline,authors[],hue,pin,trashed,characters{},actors{},chDismiss[],docs[],mainDoc,migrated,legacyExtra?}.
  Shared project data lives on the project (title, logline, characters, actors, dismissed character suggestions). Document = {id,type,name,created,updated,content,
  versions[],pool[],vl,backups[],cast[],vseq,vnote,stats{},links[]}: every document has its OWN version line (vl), versions, backups and block pool.
  Script content = {title,b,prefs}. links[] is reserved for fields linked to shared data. Unknown fields are kept (legacyExtra / as they are).
  DOCTYPES registers types (only "script" now); to add one: a DOCTYPES entry + its editor. P.versions / P.vl / P.backups / P.pool / P.cast of the VERSIONS section
  are the main script document's fields.
  Docs is the only door to storage: read(id) (private copy) / write(project) / create / remove / duplicate / edit, and Docs.docs.list/read/create/update/remove(projectId, ...).
  The open script is the editor's DOM; P is view(project): a Proxy that maps the old flat names (P.doc, P.chars, P.actors, P.chDismiss, P.versions, P.vl, P.backups,
  P.cast, P.pool, P.w/pg/sc, P.id, P.title, ...) onto the project and its main script document, so editor code did not change; an unknown name is kept in
  legacyExtra, never lost. fromV2/toV2 are the exact converters between the flat record and schema 3 (table FLAT_PROJECT / FLAT_DOC / FLAT_STAT). A NEW field on P
  that belongs to a document or to shared data should be added to that table, otherwise it lives in legacyExtra (still saved, but at project level).
  Docs.* given the open project's id work on that live object (P._proj); Docs.docs.update refuses the open script (it is changed through the editor).
  upgradeProject(raw) brings any stored project to SCHEMA (steps go in its loop); a project from a NEWER schema is never read or rewritten ({newer:true}).

MIGRATION (flat klapka.p.<id> -> schema 3 klapka.proj.<id>; migrateLegacy, retireLegacy)
  Automatic at every start for each old record without a new one: (1) desktop: ONE backup file klapka.bak.pre-v3-<time> with every old key, written first;
  (2) fromV2 + write; (3) verify: read the new key back and compare it field by field with a fresh parse of the old record (sameV2, toV2 = exact inverse of fromV2),
  on desktop the disk file is read back too; a failing project is NOT migrated, stays untouched, is named in a toast and is retried next start.
  This step never changes content. The app's own version-line migration (migrateP, IDX.vm) runs afterwards on the new projects, exactly as it did on old records.
  Old keys are never written; they are the rollback copy and are removed only after 14 days (LEG_GRACE) for verified projects, or earlier only if a browser
  has no room for two copies (then the old one makes room and is put back if the new one still does not fit). Rollback: delete klapka.proj.<id> and klapka.mig and
  restart; edits made after migrating exist only in the new key. Do not run an older build against migrated data (it will not see new edits).
  Delete forever removes both the new and the old key.

PROJECT FILE (projectFile, readProjectFile, importText)
  Export = {app:"mlx-ink", type:"project", version:3, saved, project:{whole project incl. all docs, without id/rev/pin/trashed/migrated}}. Import always makes a new
  project (readProjectFile also runs castClean and migrateP). Still read: flat version 1 and 2 files (blocks/versions/pool/vl/backups at the top), Fountain, FDX, plain text.
  A newer version number is refused with a message. The in-editor import (Import into this script) takes the main script of a version 3 file (flatOfProject, same keys
  as the old flat file) and replaces only the open script, as before.

LAYOUT AND PAGINATION (section "layout / pagination")
  layout() places every block by hand: it measures heights, then sets marginTop so blocks never straddle a page. PW/PH/MT/MB/LH come from the
  format; GAP is 32 on screen and 0 while printing (flag printing). Keep rules: scene, character and paren stay with what follows (3 blocks),
  Hollywood/European break only by this rule, European TV also starts every scene on a new page (F.sceneBreak). Pages are absolutely
  positioned .page divs; renderWM, renderRev, renderHF (watermark, revision tint and marks, header and footer) are redrawn from layout().
  While printing, layout() also sets break-before:page and paddingTop on pushed blocks so the browser's own pagination equals layout()'s.
  CSS custom properties for the page (pw, ph, mt, mr, mb, ml, lh, fs) are written by applyFormat().

FORMATS (const FORMATS)
  hw Hollywood (US Letter 816x1056, lh 16), eu European (A4 794x1122, lh 18), av European TV (A4, two columns Visual/Audio, lh 18, own element
  list; no column heads: the scene heading is two lines, see TV FORMAT below). applyFormat() sets geometry, CSS vars, the @page rule (pageStyle) and the type bar; setFormat() also remaps types (fitType).
  Per-format look is CSS under .fmt-hw / .fmt-eu / .fmt-av.

SCRIPT FONT (section "script font", right before applyFormat)
  prefs.font is saved PER SCRIPT (DOCK_, project file key font): '' = Courier Prime (default, what all older scripts used), a FONTS id (cp, termes,
  pagella, schola, heros, cursor: Courier Prime plus bundled TeX Gyre, GUST Font License, all four styles, full Czech/Central European coverage),
  or 'sys:<family>' for an installed font. applyFont() (called from applyFormat) resolves it with resolveFont() and writes --script (family stack) and
  --fs (format size x k) on :root, so editor, title page, header/footer, print and PDF all follow one variable. --mono keeps the fixed Courier stack
  for interface bits that must stay monospaced (export text preview, compare lines, character preview, home cards). Line height is a pixel grid from
  the format (LH), so a font only changes characters per line; layout() re-measures everything. k: typewriter faces = 10 characters per inch (0.6 em),
  proportional = x-height 0.45 em; for system fonts both are measured on a canvas (sysMetrics). Inline b/i/u have line-height:0 so no face can make
  a line taller than LH. A missing system font falls back to Courier Prime, the setting is kept, a toast says so (loadProject, picker).
  fontRefit() re-lays out after every face has loaded (document.fonts.load + a loadingdone listener). Picker: openFontDlg (Script > Script font,
  palette): curated list, Show more = installed fonts (Rust list_system_fonts via __TAURI_INTERNALS__, else queryLocalFonts, else a typed name that
  is checked with fontOK), live sample page (fontMock: real element CSS, real page geometry, scaled) and characters per line (fontCpl).
  Hollywood: any font is allowed but non-typewriter fonts show a warning (the page = minute rule and US readers assume 10 pitch Courier).
  Changing the font is undoable from its toast; it never touches the text. To add a bundled font: files in src/fonts, @font-face in fonts-script.css,
  one FONTS entry (k from x-height / 0.45, mono:1 for typewriter faces), a STR.cs line for its description.

MENUS, PALETTE, SHORTCUTS
  One registry: MENUS (File, Edit, Insert, Scenes, Format, View, Tools; MENU_* functions), fmtItems() return arrays of items {l, ic, d, k, f, sub, s, c, keep, sep}; popMenu()/mroot render them.
  The command palette (#pal) reads the same registries. Shortcuts: ACT list, actOf(), keyOf(); users re-map them in prefs.keys.
  Custom dropdowns replace native selects: one shared popover (ddPop, class mp ddp) appended to <body>.

EXPORT, PRINT, FILE NAMES (sections "sheets, dialogs, toast", "print", "export file names")
  Export sheet = openSheet(tab) with tabs pdf, fountain, fdx, text, csv, project (toFountain, toFdx, toPlain, toCsv, toProject).
  Files are written through downloadText(): window.mlxDesktop.saveText in the desktop build, an <a download> link in a browser.
  PDF has no engine of its own: printScript() calls window.print() (webview print dialog on desktop, browser print in a browser).
  beforeprint: printing=true, GAP=0, layout(), makeCopies() (one clone of #stack per extra watermark recipient), addTp() (a title page
  in front of each copy; the first uses the on-screen #tpWrap). afterprint undoes all of it. @media print CSS hides everything but .app.
  File names: exportBaseName(ctx) builds from prefs.fn {parts,sep,ascii,custom} (per script, in DOCK_; default Project - Document - Version; parts
  project/doc/version/author/date/lang; ascii strips diacritics; custom = {token} pattern); safeFileName() strips illegal chars, reserved Windows names, trailing dots.
  exportFileName(ext,ctx) adds an extension and is used by btnDl, exportProject, dlVersion and the print title. The export sheet shows a live preview. While printing, document.title is set to it, because the print dialog proposes the page title.

VERSIONS (section "versions"; migrateP() in "projects library")
  Every document has a version line: P.vl[doc]={cur,seq} (only doc 'script' today; another document needs its own line plus a content accessor like vBlocks).
  P.versions[]={id,doc,n,name,note,tag,lock,t,from,rf,title,f,b,w,sc,vals}, newest first. The CURRENT version (P.vl.script.cur) IS the live script: its text is
  P.doc.b + title, saved on every change by saveProject() (vSync keeps its w/sc/f/title fresh), b is null, so there is no unsaved state. newVersion() and
  restoreInto() freeze it (vFreeze: b = indexes into the shared P.pool, vals = shared project values, now {logline}; restore does not apply vals yet) and
  vMake() adds the new current one. Frozen versions are never edited, only renamed, locked, compared, restored (always as a NEW version, undo toast), deleted.
  P.backups[]={id,t,name,title,f,b,w,sc}: automatic safety copies (every 5 min, before replace/import), max 15, not versions; editor undo (H) is separate too.
  verInfo(doc) -> {n,name,label,tag,note,count} is the read API; tpVersion() uses it (shown once a 2nd version or a custom name exists) and so do export names.
  Migration (migrateP, idempotent, runs on boot once for all scripts via IDX.vm, in loadProject, newProject and import): manual versions kept, automatic ones become
  backups, live text becomes the newest version if it differs (or the newest becomes current if equal and unlocked/not Final/Approved); a one-time toast (p.vnote) says so.
  Project files carry versions, pool, backups, vl; older files migrate on import. Dock (#vdock): current card, earlier versions, safety backups, compare dialog.

CHARACTERS (section "logline, characters, italic first appearance")
  A character is a speaker cue: baseName() strips a trailing (V.O.) and upper-cases. charsInfo counts cues; P.chars[NAME] holds the profile
  {age, role, al[], voice (free text, kept), look, goal, bio, notes, nofa, actors[ids]}. A script is the project: P.chars, P.actors and P.chDismiss
  are saved with it, in the project file (characters, actors, chDismiss) and in every copy. Old scripts simply lack actors; nothing needs migrating.
  Profiles of names that left the script stay (chKeys() = cues + profiles). sceneCast() builds the cast of each scene (see CAST below),
  so renames reach it by themselves. Italic first appearance is painted by schedFA() without moving the caret.
  Actors: P.actors[id] = {id, first, last, email, phone, note}. aLabels() is the only place that decides how an actor is shown: a shared surname
  gives "P. Novak", the same initial too gives the full first name; it is recomputed on every draw. actorIndex() returns actors with characters,
  scenes, lines and words: the seam for later actor exports. The old free-text voice is never converted silently: openBible offers
  "Create actor..." (a prefilled dialog) and the Suggestions tab lists them.
  Hub (openBible(sel, tab)): tabs Characters / Actors, a Suggestions pill, at-a-glance tiles (scenes, lines, words, first page, presence bar, scene
  chips that jump), basics on top and "More detail" folded. Suggestions (dupSuggestions, nameSuggestions, voiceOffers) never change anything;
  Merge opens mergeDlg (counts, undoable, combines profiles without losing text, old name becomes an alias); dismissals live in P.chDismiss.
  renameIn(old, new, {safe, dry}) is the one rename routine (Rename uses all blocks, Merge only cues and action).

CAST OF A SCENE (section "scene lists", sceneCast .. openCastDlg; P.cast, project file key sceneCast)
  The cast line under a heading is the CSS ::after of data-cast, set by autoCastNow() (never saved, never script text). sceneCast() returns one entry per
  heading (scene or montage): det = detected names (cues + capitals in action/visual/shot), items = rows {name, src auto|pick|typed, hid, pin, ei},
  names = what is shown and exported (detected minus hidden, then picked and typed). Exports and fillCast use names; analyze() keeps using det.
  P.cast = [{h, n, o, t, a:[{c:KEY}|{t:text}], x:[hidden KEYs]}]. A record belongs to a scene by h (heading text, upper case, spaces folded) + n (nth time
  that heading occurs): no ids are written into the script. o/t = position and scene count at the last sync: if a heading is edited and the scene count is
  unchanged, castAssign(heads, true) (run by autoCastNow) moves the record to the scene at the same position; otherwise it stays unattached and the dialog
  lists it under "From scenes that are gone or renamed" (Use here / Forget). Nothing is deleted by itself. {c:KEY} is a link to the hub: renameChar and
  mergeChars call castRename(); a typed text that equals a character or an alias resolves to that character when drawn; a link whose character is gone
  is drawn as typed. Manual entries are never overwritten by detection; Hide only adds KEY to x. A hand-written scene list line (type cast) right after the
  heading still replaces the automatic line (old behaviour); the dialog says so and can remove that line on request.
  Dialog: openCastDlg(blockIndex) from Edit and Scenes menus, palette, shortcut castScene (no default key) or a click on the cast line (castHot). Every change
  goes through castChange(): history snapshot before and after (snap().x holds P.cast, restoreSnap puts it back), docTouch, redraw. "Make character" creates
  an empty profile (prof_) and links the entry; its toast can undo it. Words for quick typed entries: VOCAB crowd, extras. There is no separate project-wide
  cast list: the hub (Characters tab, Add character) is it; promoted people appear there and in the picker.

SCRIPT VOCABULARY (section "script vocabulary", right after the i18n layer)
  VOCAB[lang] holds every script-owned word: ext (V.O./O.S./O.C./CONT'D), cast heading, scene prefixes, times of day, credit line, column heads (cols),
  audio kinds (aud), element labels (el/elav), transitions, CSV headers, marker labels, watermark words, revision label and colour names.
  V('ext.vo') reads it; prefs.vterm[lang][key] overrides single terms per project (dialog: Script vocabulary > Terms). Both prefs.vocab and
  prefs.vterm are per-script (DOCK_), saved in the project file as vocab/vocabTerms. Old scripts without prefs.vocab adopt their proofing
  language once in applyDocPrefs so nothing visibly changes.
  Rules: stored text is NEVER rewritten on a language switch. On screen, CONT'D, column heads, audio kind, Synopsis/Note/Alt/Page break labels are
  drawn from CSS custom properties set in applyLabels(). Audio is stored as the canonical HUDBA:/ZVUK: prefix and shown/exported through audOut().
  The title-page credit is automatic (tp.creditAuto, or a known default like "Written by") until the user types their own; then it is kept.
  Conversion of words already written: vocabPlan() (pure) + openVocabConvert() (preview, per-kind tick boxes, one undoable commit); offered by a
  toast after a switch and from the vocabulary dialog. vocabRev() recognises terms of all languages for this and for reports (analyze, sceneId).
  Exports (Fountain, FDX, plain text, CSV, print), outline, reports, watermark presets and dates (fmtDateV) all read V(). Autocomplete lists come
  from V(). To add a language: add a VOCAB entry and a LANGS entry. To change a convention: edit one VOCAB value.

INTERFACE LANGUAGE (section "i18n: the one translation layer")
  Three separate ideas: interface language = prefs.ui ('' = follow the system, else en/cs/de/pl/sk; a UI pref in klapka.ui, NOT per script);
  proofing language = prefs.lang (per script, sets #editor lang; ''=>'en' as before); script vocabulary = prefs.vocab (per script, read through
  vocabLang(): '' follows the interface language, else en/cs/sk/de/pl; every language has a full VOCAB table, nothing falls through to Czech).
  English text is the key. _('Text {n}',{n}) looks up STR[UI]; _n('page',n) uses PLUR[UI][id] with Intl.PluralRules (one/few/many/other). Missing
  entries fall back to English. Number and date formats: fmtNum, fmtDate, fmtDateTime (locale from LANGS). Write English in code, add the key to STR.cs.
  Static markup, menu/palette registries (it.l, it.d, it.hd) and dialog bodies are translated by trTree() + a MutationObserver on exact text nodes and
  title/aria-label/placeholder/data-ph; it never touches #stack (the script), inputs, textareas or user text (SKIP_T). Text with variables, toasts built
  from pieces, tooltips set by code and stored English defaults (Untitled script, Automatic, Version N) use _() / dispTitle() / vName() explicitly.
  Toolbar element names and the Visual/Audio toggles (#seg, #visTog, #akind) are script vocabulary and stay English for now (SKIP_T).
  New language: add to LANGS, fill STR.<code> and PLUR.<code>. cs is complete; de/pl/sk cover menus, home, toasts and common dialogs (about 400 strings),
  the long help sentences stay English there. Picker: openLangDlg (globe on the home bar, File and home More menus, palette). setUiLang() is instant,
  saved, never touches the script; open docks are re-rendered. Printed header/footer dates follow the interface locale; the saved revision date does not.

TV FORMAT (fmt-av): HEADING, COLUMN LINE, LINE NUMBERS
  A scene is stored as ONE block of text (the location line, e.g. "INT. NADRAZNI HALA - NOC"). The first heading line ("Obraz 3") is NOT text:
  it is the CSS ::before of div.el[data-t=scene] = V('scn') (custom property --lbl-scn, set in applyLabels) + counter(sc), so the number is
  automatic, follows the script vocabulary language (prefs.vocab / vterm 'scn') and is never saved or typed. The scene gets padding-top: var(--lh)
  to leave room for it. Enter inside a heading never splits it (doEnter): the next Visual line opens below. prefs.nums (margin scene numbers) only
  applies to Hollywood/European. headTxt() flattens stray line breaks of old headings for navigator, cards, outline and exports (stored text is untouched).
  Navigator, index cards, palette and outline show label + location (scnLbl); plain-text export prints it centred; FDX writes Number=; Fountain and CSV unchanged.
  Column heads (the Visual/Audio labels and their toggle) are gone; prefs.hide.h is ignored. Visual/Audio column visibility toggles remain.
  Column line (prefs.divider): renderDiv() (called at the end of layout) puts one div.dv per page and per stretch without a heading: it starts under
  the heading on a scene's first page, at the top margin on continuation pages, and ends at the bottom margin. It is a border (prints without
  "background graphics"). Hidden when either column is hidden.
  Line numbers (prefs.shots, now explicit: true = on, anything else = off, default off; old saved false/undefined = off, true = on): one counter per scene,
  reset at each heading, +1 for every visual, speaker cue (its parentheticals and dialogue share the cue's number) and audio block, in reading order,
  drawn in the left page margin (right-column items are shifted left by the column width). Hidden columns are skipped by the counter.
  Print: pushed blocks get padding-top = MT + own padding and the custom property --ptop = MT so heading label, audio label and numbers sit at the top margin.

MONTAGE
  One montage = one scene number. Types: 'montage' (heading, takes the number, e.g. "MONTAGE - TRAINING") and 'shot' (a lettered scene INSIDE it, drawn 7A, 7B
  in the margin; with the nums-none setting only A, B). isHead() is true for 'scene' and 'montage' only, so a 'shot' never opens a new number.
  A montage scene is a heading plus ordinary lines (action, character, dialogue, audio...) written as in a normal script. The montage ends at END MONTAGE.
  END MONTAGE is NOT a type: it is an action (TV: visual) line whose whole text is the localized end word (VOCAB.<lang>.monend, any language is recognised,
  see isMontEnd). That keeps old storage, Fountain, FDX and plain text working unchanged; .el.mend only styles it. inMontage(b) walks back and stops at it
  or at the first heading. A scene heading or a new montage also closes an open montage implicitly.
  Place convention: the scene heading line of an item is plain scene-heading text ("INT. GYM - DAY"), bold + capitals by CSS (:not(:has(b))). Old items that start
  with a bold run ("**GYM** - text") still work: the leading bold run is the place; shotUp/shotPlain keep it. Items without a bold place are upper-cased
  in every export except European TV (where a) b) lines keep their case).
  Writing flow: Montage button / Alt+8 = start a montage when outside one, END it when inside one. Enter on the montage heading makes the first item and
  opens suggestions: INT. / EXT. / INT./EXT. first, then places already used in the script (time ignored, most used first), then the time of day after " - ".
  Under the last line of the LAST scene a floating bar (#mnx, placeMonBar) offers Next scene (new lettered item after the current one, Ctrl+Enter) and End montage
  (writes END MONTAGE, then an empty normal line). Enter on an empty item also ends the montage. Tab on an item heading moves on to normal text (a bold
  place is only made from short non-heading text, makePlace).
  Export mapping: Fountain "- ITEM" lines (dash list) while inside a montage, END MONTAGE as a forced action (!END MONTAGE); FDX Shot paragraphs, END MONTAGE as Action;
  plain text lettered a) b) in the TV format, 7A 7B otherwise; CSV/outline/navigator list items under the montage number. Import: after a montage heading, "- " lines
  and FDX Shot paragraphs become items until an END MONTAGE line or the next scene heading.

NAMING CONVENTIONS
  Functions: verb-first camelCase (openSheet, applyFormat); small helpers are short consts ($, lsGet, lsSet, clone, esc). Block types are
  lower-case strings. Element ids use a prefix by area: btn*, tp* (title page), fb* (find bar), x* (export sheet), h* (home), v* (versions).
  CSS classes: .tp-* title page, .hf header/footer, .wm* watermark, .rv* revisions, .xbtn/.xopt export sheet, .mp menus. Storage keys: "klapka." (the historical prefix of the old name, kept on purpose: renaming keys would hide existing scripts).

KNOWN LIMITATIONS
  Print was verified only in headless Chromium (Playwright page.pdf, which fires beforeprint/afterprint), NOT in the WebView2 print dialog.
  Whether the WebView2 dialog uses document.title as its suggested name could not be checked; the user can still rename in that dialog.
  Pagination depends on the font: if Courier Prime or a chosen font is missing the fallback has other metrics and lines wrap differently.
  list_system_fonts (Rust) was written without a Rust toolchain and is not compiled or run yet; the front end degrades to a typed font name.
  Font checks ran in headless Chromium with system fonts of that machine, not in WebView2. Only Windows font folders are scanned by the Rust command.
  Overlays appended to <body> must never take part in print layout (rule body > :not(.app) in @media print); a hidden position:fixed box
  without top/left sits at the END of the printed content and creates an extra page.
  Export source: EXSRC={v} makes Fountain/FDX/text export a saved version (exBlocks(); cast lines need the live DOM so are off for versions); exportAllVersions() saves one file per
  manual version through saveFile() (native dialog per file on desktop). ex().notes switches notes/alternatives/beats in Fountain. PDF, CSV and project file always use the current script.
  Plain browser mode is still localStorage only (measured limit about 5.2 M characters; a 300-page script with 25 versions is about 1.3 M, so about four fit).
  Only the desktop build with the Rust store removes that limit. At start every project is loaded into memory (fine for dozens, not thousands).
  vault.rs and the disk path of Vault were written/tested against a fake store in headless Chromium, NOT compiled or run with Rust or in WebView2.
  desktop.ts also mirrors klapka.proj.* (a second copy on disk, so a big project exists twice there); watch the size of the app data folder.
  Two windows/tabs on the same data are not coordinated (last write wins; browser mode listens to the storage event).

HOW PRINT WAS CHECKED
  Load the app with a seeded klapka.* storage, call page.pdf(preferCSSPageSize), compare the PDF page count with the "N pages" counter
  times the number of recipient copies plus one title page per copy. Cases: 3 formats, short/long/page-exact scripts, title page, watermark
  (also 2 recipients), revisions, header/footer. Also dispatch beforeprint twice and check the screen layout is the same after afterprint.

FRONT PAGE (title page; sections "title page" in the script and CSS "front page: zones")
  prefs.tp (per script, in DOCK_, project file titlePage, copies, versions) holds the texts (credit, author, source, draft, contact, version,
  doctype, owner, company, agent, copyright) plus the LAYOUT: preset (TP_PRESETS: classic, hollywood, czech, set, pitch, modern, minimal),
  fon {field:bool} and fz {field:zone} (overrides of the preset), align, ownerLink, dateAuto. Old scripts get preset "classic" = the old look.
  Zones: t (top), c (centre), bl, bc, br (bottom row). Every field is optional: tpFill() builds only enabled fields; on screen an enabled empty
  field is an editable placeholder (class emp), in Preview (#tpPv), in print and in recipient copies empty fields are hidden, so nothing leaves a gap.
  Linked values: title = #doc-title, logline = P.logline, version = tpVersion(), date = print date unless typed, owner = watermark recipient
  (tpVal). tpSig() decides when the DOM is rebuilt (structure only); renderTp() otherwise just refreshes values. tpModel(name) is the one
  source for FDX/Fountain. openFrontDlg() = preset cards (tpMini previews), field toggles + zone, alignment; changes are undoable via toast and
  never touch text. P.docType (script|treatment|synopsis|characters) is a seam for a future documents step: it sets the doctype label; the
  documents step itself does not exist in this build. No Rust/config files changed.

ACTOR SIDES (openActorExport, axJobs, axBegin/axEnd, runActorExport; entry points: character hub left column and actor form, Tools > Characters)
  One job = one actor x one scope (full script with their lines marked, or only their scenes). Jobs go through the normal print path one after another:
  axPrint() sets AXJ, window.print() fires beforeprint -> axBegin(), afterprint -> axEnd() + AXJ.fin(). The script is never touched: highlight = class .axh
  (+ .app.ax-yellow/grey), left-out blocks = data-axo, which layout() treats as zero height and as non-neighbours (om/pv); real scene numbers are kept
  with an inline counter-set. Watermark: no second system. axBegin swaps prefs.wm for a copy whose only recipient is aMark(id) (surname, or "P. Novak" for a
  shared surname, same rule as aLabels) and adds a {name} layer when the user's layers have none; docPrefs() saves AXJ.wmSave, so the temporary one is never stored.
  The title page "copy for" field follows it for free. File names: exportBaseName({cfg:axNameCfg(),actor,scope}); parts 'actor' and 'scope' (FN_ALL) are
  empty in every other export; actor is always added, scope when "Both"; duplicates get " (2)". prefs.ax = {mode,hl,wm} is a UI pref (klapka.ui).
  No actor contact details are ever written to a copy. A PDF is made by the print dialog, so each file asks for its own Save; "Stop" in the toast between jobs.
  No Rust/config files changed.

PDF INCLUDES (from index_25): XPR holds sheet-only choices for title page, watermark, header/footer, revision marks (missing = as in the script; never saved,
  cleared by closeAll). The PDF button copies them to PRO; beforeprint prApply() puts them into prefs, afterprint prUndo() restores, docPrefs() keeps saving the
  real values meanwhile (also while an actor export swaps the watermark). Ctrl+P / File > Print use the script settings. exPdfPreview() draws the real title page
  (tpMini) and the total page count (title page and watermark copies included). The older file-name panel (fnPanel) is kept; the name card of index_25 is not ported.

BRAND AND FIRST RUN: FEATHER_D / featherSvg(px,'draw') hold the supplied feather (mlx-ink-feather-teal.svg), drawn inline in the home bar (.brand), the home empty state,
  the welcome screen and tutorial step 1; the favicon in <head> is the supplied app icon (mlx-ink-app-icon-updated.svg) as a data URI. First launch: openWelcome()
  (language screen, only when prefs.ui is empty and prefs.langAsked is not set; choosing switches the interface at once) and then openTour(0). Both flags are UI prefs set
  when the dialog opens, so each shows once. The tutorial (TOUR, tourVis, openTour) has eight steps, clickable dots, left/right keys, and an example-script button on the last.

.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em;margin:0 10px 0 2px;user-select:none}
.brand svg{width:22px;height:22px;fill:var(--accent)}
.menubar{display:flex;gap:2px}
.mb{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--fg);font:550 13.5px var(--ui);transition:background .15s}
.mb:hover{background:var(--seg)}
.mb[aria-expanded="true"]{background:var(--seg2)}
.title{flex:1 1 90px;min-width:0;max-width:300px;margin-left:8px;background:transparent;border:1px solid transparent;border-radius:8px;
  padding:5px 9px;font:600 14px var(--ui);color:var(--fg);text-overflow:ellipsis;transition:background .15s,border-color .15s,box-shadow .15s}
.title:hover{background:var(--seg)}
.title:focus{background:var(--panel-solid);border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.title::placeholder{color:var(--fg-soft);font-weight:500}
.spacer{flex:1}
.stats{color:var(--fg-soft);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font:600 11.5px var(--ui);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.save{display:inline-flex;align-items:center;gap:6px;color:var(--fg-soft);font-size:12px;padding:0 6px;white-space:nowrap;user-select:none}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);transition:background .2s,transform .2s}
.save[data-s="dirty"] i{background:var(--warn);transform:scale(1.15)}
.icon{width:32px;height:32px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;color:var(--fg-soft);transition:background .15s,color .15s,transform .1s}
.icon:hover{background:var(--seg);color:var(--fg)}
.icon:active{transform:scale(.93)}
.icon[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.icon.sm{width:28px;height:28px;border-radius:7px}
.i{flex:none;display:block}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--seg);color:var(--fg-soft);font:550 12.5px var(--ui);white-space:nowrap;transition:color .15s,background .15s}
.pill:hover,.pill[aria-expanded="true"]{color:var(--fg);background:var(--seg2)}
.pill .ks{display:flex;gap:3px}
kbd{font:600 10.5px/1 var(--ui);color:var(--fg-soft);background:var(--seg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 5px;min-width:19px;text-align:center;display:inline-block}
#btnTheme{position:relative}
#btnTheme .thi{grid-area:1/1;transition:transform .4s var(--ease),opacity .25s}
#btnTheme .thi:not(.on){opacity:0;transform:rotate(-80deg) scale(.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:9px;padding:7px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--seg);color:var(--fg);filter:none}
.btn.ghost:hover{background:var(--seg2)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line);filter:none}
.btn.danger:hover{background:rgba(200,55,45,.1)}
.btn:disabled{opacity:.4;pointer-events:none}

/* menus: File, Tools, Format. Panels open under the bar, sub-sections open to the side on hover. */
.mroot{position:fixed;inset:0;z-index:40;pointer-events:none}
.mp{position:fixed;display:flex;flex-direction:column;min-width:236px;max-width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 20px);padding:5px;background:var(--panel-solid);
  -webkit-backdrop-filter:saturate(1.6) blur(24px);backdrop-filter:saturate(1.6) blur(24px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);pointer-events:auto;
  opacity:0;transform:translateY(-5px) scale(.98);transform-origin:top left;transition:opacity .14s var(--ease),transform .18s var(--ease)}
.mp.in{opacity:1;transform:none}
.mp.sub{transform:translateX(-7px) scale(.98)}
.mp.sub.in{transform:none}
.mp.r{transform-origin:top right}
.ml{display:flex;flex-direction:column;gap:1px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;min-height:0}
.msearch{display:flex;align-items:center;gap:8px;padding:5px 8px 8px;margin:0 0 4px;border-bottom:1px solid var(--line);color:var(--fg-soft)}
.msearch input{flex:1;min-width:0;border:0;background:transparent;font:14px var(--ui);color:var(--fg);outline:0}
.msearch input::placeholder{color:var(--fg-soft)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:31px;padding:4px 9px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:13.5px;color:var(--fg);transition:background .1s}
.mi .ic{width:16px;height:16px;flex:none;color:var(--fg-soft);display:grid;place-items:center}
.mi.hot,.mi.open{background:var(--seg2)}
.mi[aria-disabled="true"]{opacity:.38;pointer-events:none}
.mi .lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mi .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .ds{font-size:11.5px;color:var(--fg-soft);line-height:1.3}
.mi .pth{color:var(--fg-soft);font-size:11.5px;margin-left:7px}
.mi mark{background:transparent;color:var(--accent);font-weight:650}
.mi .ks{display:flex;gap:3px;flex:none}
.mi .vl{color:var(--fg-soft);font-size:12px;flex:none}
.mi .chv{color:var(--fg-soft);flex:none;display:grid}
.mi[role="menuitemradio"] .ic svg{opacity:0;color:var(--accent);transition:opacity .12s}
.mi[role="menuitemradio"][aria-checked="true"] .ic svg{opacity:1}
.msep{height:1px;margin:4px 6px;background:var(--line);flex:none}
.mhd{font:700 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-soft);padding:8px 10px 3px}
.mnone{padding:18px;text-align:center;color:var(--fg-soft);font-size:13px}

.el[data-t="cast"]{color:var(--ink-soft)}
.el[data-t="pagebreak"]::before{content:var(--lbl-brk,"Page break");display:block;border-top:1px dashed var(--ink-soft);color:var(--ink-soft);font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;padding-top:2px;user-select:none}
.el[data-t="synopsis"]{color:var(--accent);font:italic .85em/var(--lh) var(--ui);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-left:-6px}
.el[data-t="synopsis"]::before{content:var(--lbl-syn,"Synopsis · ");font-style:normal;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em;user-select:none}
.app.cont .el[data-t="character"][data-cont]::after{content:var(--lbl-contd," (CONT'D)")}
/* watermark layers: real SVG over (or behind) the text; ignores the mouse and prints with the page */
.wmc{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.wmc[data-z="front"]{z-index:3}
.wmpage{position:absolute;left:0;width:var(--pw);height:var(--ph);overflow:hidden;pointer-events:none}
.wms{position:absolute;left:0;top:0;display:block;pointer-events:none;overflow:hidden}
.tpage>.wmpage{top:0;height:100%;z-index:3}
/* revisions: asterisks in the right margin, tinted pages, a label at the top */
.revlayer{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:2}
.rvs{position:absolute;font:700 var(--fs)/var(--lh) var(--script);color:var(--ink);user-select:none}
.page.rv{background:color-mix(in srgb,var(--pc) 24%,var(--paper))}
.rvl{position:absolute;left:var(--ml);top:calc(var(--mt) - 64px);font:700 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none;user-select:none}
.hf{position:absolute;left:var(--ml);right:var(--mr);display:grid;grid-template-columns:1fr auto 1fr;gap:12px;font:13px var(--script);color:var(--ink-soft);pointer-events:none;user-select:none;white-space:pre}
.hf.h{top:calc(var(--mt) - 72px)}
.hf.f{bottom:calc(var(--mb) - 52px)}
.hf span:nth-child(2){text-align:center}
.hf span:nth-child(3){text-align:right}
.app.locked .typebar{opacity:.5;pointer-events:none}


/* element selector */
.typebar{display:flex;justify-content:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5;transition:opacity .25s}
.seg{overflow-x:auto;max-width:100%;border-radius:11px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg-in{position:relative;display:grid;grid-template-columns:repeat(6,minmax(88px,1fr));min-width:540px;background:var(--seg);border-radius:11px;padding:3px}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/6);border-radius:8px;background:var(--panel-solid);
  box-shadow:0 1px 3px rgba(10,30,34,.18);transition:transform .28s cubic-bezier(.3,.8,.2,1)}
.seg button{position:relative;border:0;background:transparent;padding:6px 8px;border-radius:8px;color:var(--fg-soft);font-weight:550;font-size:13px;transition:color .15s}
.seg button[aria-pressed="true"]{color:var(--fg)}

/* navigator */
.main{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:0;position:relative;transition:grid-template-columns .3s cubic-bezier(.3,.8,.2,1)}
.app.nav-closed .main{grid-template-columns:0 minmax(0,1fr)}
.side{min-width:0;overflow:hidden;border-right:1px solid var(--line);background:var(--panel-solid)}
.app.nav-closed .side{border-right-color:transparent}
.side-in{width:264px;height:100%;display:flex;flex-direction:column;padding:12px 10px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg);border-radius:9px;padding:2px;margin-bottom:10px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:600;color:var(--fg-soft)}
.tabs button.on{background:var(--panel-solid);color:var(--fg);box-shadow:0 1px 2px rgba(10,30,34,.16)}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
.list button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;transition:background .12s}
.list button:hover{background:var(--seg)}
.list button.on{background:var(--accent-soft)}
.list .n{color:var(--fg-soft);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.list .tx{text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.list .pg{color:var(--fg-soft);font-size:11.5px;font-variant-numeric:tabular-nums}
.list button.two{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.list .sl{display:block;font-size:11px;font-weight:600;color:var(--fg-soft);text-transform:none;letter-spacing:.01em}
.card .ch2.two{flex-direction:column;gap:2px;align-items:flex-start}
.list .empty{color:var(--fg-soft);padding:10px 8px;font-size:13px}
#sceneList .tx{text-transform:uppercase}
#charList button{grid-template-columns:minmax(0,1fr) auto}

/* canvas + paper */
.canvas{overflow:auto;padding:24px 16px 160px;background:var(--bg);min-width:0}
.fit{margin:0 auto;position:relative}
.stack{position:relative;width:var(--pw);transform-origin:0 0}
.page{position:absolute;left:0;width:var(--pw);height:var(--ph);background:var(--paper);border-radius:3px;box-shadow:var(--shadow)}
.pn{position:absolute;right:var(--mr);top:calc(var(--mt) - 44px);font:13px var(--script);color:var(--ink-soft);pointer-events:none;user-select:none}
.hint{position:absolute;left:var(--ml);top:var(--mt);font:var(--fs)/var(--lh) var(--script);color:var(--ink-soft);pointer-events:none;user-select:none;opacity:0;transition:opacity .2s}
.hint.on{opacity:1}
.editor{position:relative;padding:var(--mt) var(--mr) var(--mb) var(--ml);min-height:var(--ph);outline:none;color:var(--ink);caret-color:var(--accent);
  font:var(--fs)/var(--lh) var(--script);white-space:pre-wrap;overflow-wrap:break-word;counter-reset:sc;-webkit-user-modify:read-write}
.editor ::selection,.editor::selection{background:var(--accent-soft)}
.el{position:relative;min-height:var(--lh);transition:opacity .2s}
.el[data-t="scene"],.el[data-t="montage"]{font-weight:700;text-transform:uppercase;counter-increment:sc;counter-reset:mi}
.el[data-t="scene"]::before,.el[data-t="montage"]::before{content:counter(sc);position:absolute;right:calc(100% + 16px);width:44px;text-align:right;font-weight:400;color:var(--ink-soft);user-select:none}
.app.nums-both .el[data-t="scene"]::after,.app.nums-both .el[data-t="montage"]::after{content:counter(sc);position:absolute;left:calc(100% + 16px);font-weight:400;color:var(--ink-soft);user-select:none}
.el[data-t="character"]{text-transform:uppercase;font-weight:700}
.el[data-t="paren"]{margin-left:96px;margin-right:96px;font-style:italic}
.el[data-t="paren"]::before{content:"("}
.el[data-t="paren"]::after{content:")"}
.el[data-t="dialogue"]{padding-left:96px;padding-right:48px}
.el[data-t="transition"]{text-align:right;text-transform:uppercase}
.app.nums-none .el[data-t="scene"]::before,.app.nums-none .el[data-t="montage"]::before{display:none}

/* Formats: only geometry and element styling change; the chrome stays identical.
   Hollywood: US Letter, 1.5in left, cue at 3.7in, dialogue at 2.5in, parenthetical at 3.1in (measured from the page edge). */
.fmt-hw .el[data-t="character"]{font-weight:700;padding-left:211px}
.fmt-hw .el[data-t="paren"]{font-style:normal;margin-left:154px;margin-right:192px}
.fmt-hw .el[data-t="dialogue"]{padding-left:96px;padding-right:144px}
/* Central European TV: Visual left, Audio right, hairline between, column heads on every page. */
.fmt-av .el[data-t="visual"],.fmt-av .el[data-t="action"],.fmt-av .el[data-t="transition"]{width:var(--colw);text-align:left;text-transform:none}
.fmt-av .el[data-t="character"],.fmt-av .el[data-t="paren"],.fmt-av .el[data-t="dialogue"],.fmt-av .el[data-t="audio"]{width:var(--colw);margin-left:calc(var(--colw) + 24px);margin-right:0;padding:0}
.dv{display:none;position:absolute;left:calc(var(--ml) + var(--colw) + 12px);width:0;border-left:1px solid var(--ink-soft);opacity:.45;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fmt-av.divider .dv{display:block}
.fmt-av.hide-v .dv,.fmt-av.hide-a .dv{display:none}
/* focus mode: bars slide away and return when the pointer touches the top edge */
.app.focus{grid-template-rows:minmax(0,1fr)}
.app.focus .bar,.app.focus .typebar{position:absolute;left:0;right:0;z-index:7;transform:translateY(-115%);opacity:0;pointer-events:none}
.app.focus .typebar{top:51px}
.app.focus.peek .bar,.app.focus.peek .typebar{transform:none;opacity:1;pointer-events:auto}
.app.focus .main{grid-template-columns:0 minmax(0,1fr)}
.app.focus .side{border-right-color:transparent}
.app.focus .el{opacity:.28}
.app.focus .el.cur{opacity:1}
.focus-chip{position:fixed;left:50%;bottom:26px;display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font:550 13px var(--ui);
  transform:translate(-50%,14px);opacity:0;visibility:hidden;transition:opacity .25s,transform .3s var(--ease),visibility .25s;z-index:30;pointer-events:none}
.focus-chip.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.focus-chip kbd{background:rgba(128,140,142,.28);border-color:rgba(128,140,142,.4);color:inherit}


.sug{position:absolute;z-index:4;min-width:200px;background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;font:13px var(--ui);
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s}
.sug.open{opacity:1;visibility:visible;transform:none}
.sug button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 10px;color:var(--fg);font-family:var(--script)}
.sug button.on{background:var(--accent-soft)}
.sug small{font:11px var(--ui);color:var(--fg-soft);padding:4px 10px 2px;display:block}


/* title page: a real first page, edited in place */
.tpwrap{margin:0 auto 32px;position:relative}
.tp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 8px;font-size:12.5px;color:var(--fg-soft)}
.tp-bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.tpbox{position:relative}.tpbox.off .tpage{opacity:.5}
.tpage{box-sizing:border-box;position:relative;width:var(--pw);height:calc(var(--ph) - 1px);padding:var(--mt) var(--mr) var(--mb) var(--ml);background:#fff;color:#000;font:var(--fs)/var(--lh) var(--script);display:flex;flex-direction:column;overflow:hidden;break-after:page;page-break-after:always}
.tpscr{background:var(--paper);color:var(--ink);box-shadow:var(--shadow);border-radius:3px;transform-origin:0 0}
.tp-mid{flex:1;padding-top:22%;text-align:center}
.tp-g{margin:0 0 1.6em}
.tp-lab{display:block;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.tp-f{outline:none;white-space:pre-wrap;overflow-wrap:anywhere;min-height:var(--lh);border-radius:4px}
.tpscr .tp-f:hover,.tpscr .tp-f:focus{background:var(--accent-soft)}
.tp-f:empty::before{content:attr(data-ph);color:var(--ink-soft);opacity:.7}
.tp-t{font-weight:700;text-transform:uppercase;font-size:1.5em;line-height:1.3}
.tp-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:2em}







.el[data-t="scene"][data-cast]::after,.el[data-t="montage"][data-cast]::after{content:attr(data-cast);display:block;font:400 .78em/var(--lh) var(--ui);letter-spacing:.02em;text-transform:none;color:var(--ink-soft);user-select:none;pointer-events:none}
.el b{font-weight:700}
/* inline runs (bold, italic, underline, first-appearance italics) must never make a line taller than the pixel grid: faces split ascent/descent differently, and a 1px growth would shift every later page break */
.editor .el b,.editor .el i,.editor .el u,.editor .el em,.editor .el strong,.editor .el span,.fpp .el b,.fpp .el i,.fpp .el u{line-height:0}




.el[data-t="note"]{background:#f6d860;color:#3a2f00;font:.85em/var(--lh) var(--ui);border-radius:4px;padding:0 6px;margin-left:-6px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.el[data-t="note"]::before{content:var(--lbl-note,"Note · ");font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em;user-select:none}
.fmt-av .el[data-t="scene"],.fmt-av .el[data-t="montage"]{counter-reset:shot mi}
.app.shots.fmt-av .el[data-t="visual"],.app.shots.fmt-av .el[data-t="character"],.app.shots.fmt-av .el[data-t="audio"]{counter-increment:shot}
.app.shots.fmt-av .el[data-t="visual"]::before,.app.shots.fmt-av .el[data-t="character"]::before,.app.shots.fmt-av .el[data-t="audio"]::after{content:counter(shot);position:absolute;left:-30px;top:var(--ptop,0px);width:24px;text-align:right;font:600 10px/var(--lh) var(--ui);text-decoration:none;text-transform:none;color:var(--ink-soft);user-select:none;pointer-events:none}
.app.shots.fmt-av .el[data-t="character"]::before,.app.shots.fmt-av .el[data-t="audio"]::after{left:calc(-1 * (var(--colw) + 24px) - 30px)}

/* Montage items: lettered in the margin (7A, 7B), tight list, the place is the leading bold run. TV: inline "a)" in the Visual column. */
.el[data-t="shot"]{counter-increment:mi}
.el[data-t="shot"]::before{content:counter(sc) counter(mi,upper-alpha);position:absolute;right:calc(100% + 16px);width:44px;text-align:right;font-weight:400;color:var(--ink-soft);user-select:none;pointer-events:none}
.app.nums-none .el[data-t="shot"]::before{content:counter(mi,upper-alpha)}
.el[data-t="shot"] b{text-transform:uppercase}
.el[data-t="shot"]:not(:has(b)){font-weight:700;text-transform:uppercase}
.el.mend{font-weight:700;text-transform:uppercase}
.app.fmt-av .el[data-t="shot"]{width:var(--colw);text-align:left}
.app.fmt-av .el[data-t="shot"]:has(b){text-transform:none;font-weight:400}
.app.fmt-av .el[data-t="shot"]::before{position:static;display:inline;width:auto;content:counter(mi,lower-alpha) ")  ";font-weight:700;color:var(--ink)}
.app.shots.fmt-av .el[data-t="shot"]{counter-increment:shot mi}
.app.shots.fmt-av .el[data-t="shot"]::after{content:counter(shot);position:absolute;left:-30px;top:var(--ptop,0px);width:24px;text-align:right;font:600 10px/var(--lh) var(--ui);color:var(--ink-soft);user-select:none;pointer-events:none}

.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.card.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.card small{color:var(--fg-soft);font-size:11.5px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}

.dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:inline-block}

/* title page + notes (unchanged geometry) */

@media (max-width:820px){
  .main{display:block}
  .side{position:absolute;inset:0 auto 0 0;width:min(300px,86vw);z-index:4;transform:translateX(0);transition:transform .3s var(--ease);box-shadow:var(--shadow);border-right:0}
  .app.nav-closed .side{transform:translateX(-105%)}
  .canvas{height:100%}
  .brand span,.stats,.pill .ks,.save span,.pill .pl{display:none}
  .title{max-width:none}
  .dock{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:min(64vh,540px);transform:translateY(calc(100% + 24px))}
  .xbody{grid-template-columns:1fr}
  .xnav{flex-direction:row}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

@media print{
  .el[data-t="pagebreak"]{visibility:hidden}.el[data-t="synopsis"],.el[data-t="note"]{display:none}
  .findbar,.tp-bar,.tp-lab{display:none!important}
  .tp-f:empty::before{content:none}
  .tpwrap{width:var(--pw)!important;margin:0}.tpbox{height:auto!important}
  .tpscr{transform:none!important;box-shadow:none;border-radius:0;background:#fff;color:#000}
  .app.tp-off .tpwrap{display:none}
  :root:root:root{--paper:#fff;--ink:#000;--ink-soft:#555}
  html,body{height:auto;overflow:visible;background:#fff}
  .bar,.typebar,.side,.hint,.toast,.scrim,.sheet,.pal,.sug,.mnx,.castpill,.dlg,.dock,.mroot,.zoom,.focus-chip{display:none!important}
  /* Only .app is printed. Every other direct child of <body> (menus, dialogs, the dropdown popover .ddp, future overlays) is removed from
     print layout. A hidden position:fixed popover without top/left sits at its static position, which in print is the end of the script,
     and its few pixels used to spill onto an extra blank last page. */
  body>:not(.app){display:none!important}
  .app{display:block;height:auto;overflow:visible}
  .main{display:block}
  .canvas{overflow:visible;padding:0;background:#fff}
  .fit{width:var(--pw)!important;height:auto!important;margin:0}
  .stack{transform:none!important}
  .page{box-shadow:none;border-radius:0;background:#fff}
  .page.rv{background:color-mix(in srgb,var(--pc) 24%,#fff);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wms{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app.focus .el{opacity:1}
  .copy{break-before:page;page-break-before:always}
}

.app.nums-both .castpill{margin-left:42px}

/* monochrome SVG element icons + slimmer bars */
.seg button{min-height:28px;padding-top:4px;padding-bottom:4px}
.seg button .em{font:0/0 sans-serif;filter:none;color:var(--fg-soft);opacity:.85;display:inline-grid;place-items:center}
.seg button .em svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg button:hover .em{filter:none;color:var(--fg);opacity:1}
.seg button[aria-pressed="true"] .em{filter:none;color:var(--accent);opacity:1}
.bar{min-height:42px;padding:3px 12px}
.hbar{min-height:46px;padding:6px 22px}
.seg-in .thumb{pointer-events:none}
.tip{max-width:340px}.tip .tt{white-space:normal}

/* tutorial */
.tour{padding:4px 22px 20px;text-align:center}
.tour h3{margin:14px 0 6px;font-size:20px;letter-spacing:-.01em}
.tour p{margin:0 auto;max-width:400px;color:var(--fg-soft);font-size:14px;line-height:1.55;min-height:66px}
.tv{height:136px;display:grid;place-items:center;animation:tvIn .42s var(--ease) both}
@keyframes tvIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.tv-brand{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tv-seg{display:flex;gap:6px;padding:6px;border-radius:13px;background:var(--seg)}
.tv-seg span{display:grid;justify-items:center;gap:3px;width:60px;padding:8px 0 5px;border-radius:9px;color:var(--fg-soft);animation:emIn .4s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.tv-seg span:first-child{background:var(--panel-solid);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tv-seg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tv-seg small{font-size:10.5px;font-weight:550;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-keys{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--fg-soft)}.tv-keys i{font-style:normal}
.tv-keys .ks{display:flex;gap:3px}
.tv-sug{text-align:left;font-family:var(--script);font-size:14px}
.tv-head{padding:3px 8px;font-weight:700}.tv-head i{display:inline-block;width:1px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tv-list{display:grid;min-width:170px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel-solid);box-shadow:var(--shadow)}
.tv-list b{font-weight:500;padding:5px 10px;border-radius:7px}.tv-list b.on{background:var(--accent-soft)}
.tv-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.tv-pill.castpill{position:static;display:inline-flex;opacity:1;visibility:visible;transform:none;pointer-events:none}
.tv-mont{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:9px;background:var(--seg);font-weight:550;font-size:13px}
.tv-k{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--seg);font-size:13px;color:var(--fg-soft)}.tv-k .ks{display:flex;gap:3px}
.tv-chip{padding:7px 14px;border-radius:9px;background:var(--seg);font-weight:550;font-size:13px;color:var(--fg-soft)}.tv-chip.on{background:var(--accent-soft);color:var(--accent)}
.tnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.tnav .spacer{flex:1}.tnav .btn{white-space:nowrap}
/* brand feather, first-run language screen, tutorial extras */
.feather{display:block;fill:#00BFA6;flex:none}.brand .feather{fill:#00BFA6;width:24px;height:24px}
.feather.draw path{stroke:#00BFA6;stroke-width:7;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:fthDraw 1.5s var(--ease) .2s forwards,fthFill .7s ease 1.2s forwards}
@keyframes fthDraw{to{stroke-dashoffset:0}}@keyframes fthFill{to{fill-opacity:1}}
.tv-logo{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:radial-gradient(circle at 43% 29%,#141516,#0b0c0d 58%,#050606);box-shadow:inset 0 0 0 1.5px #3b3e40,0 10px 26px rgba(0,0,0,.22)}

.wlc{padding:4px 20px 8px;text-align:center}.wlc .tv-logo{margin:0 auto;animation:tvIn .42s var(--ease) both}
.wlc h3{margin:14px 0 2px;font-size:22px;letter-spacing:-.02em}.wlc .wl-sub{margin:0 0 14px;color:var(--fg-soft);font-size:14px}

.tv-card b{font:650 13px var(--script);letter-spacing:.02em}.tv-card small{font-size:12px;color:var(--fg-soft)}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const ed=$('#editor'),stack=$('#stack'),fit=$('#fit'),canvas=$('#canvas'),pagesEl=$('#pages'),app=$('#app'),
  titleEl=$('#doc-title'),sugEl=$('#sug'),hintEl=$('#hint'),statsEl=$('#stats'),thumb=$('#thumb'),seg=$('#seg');
const ALL=['scene','action','character','paren','dialogue','transition','visual','audio','cast','pagebreak','synopsis','note','alt','beat','montage','shot'];
const EXTRA=['cast','pagebreak','synopsis','note','alt','beat'];

/* MONTAGE (see ARCHITECTURE NOTES): 'montage' is a heading that takes ONE scene number, 'shot' is one lettered item inside it. isHead = anything that opens a numbered unit. */
const MONT=['montage','shot'];

const NAME={scene:'Scene heading',action:'Action',character:'Character',paren:'Parenthetical',dialogue:'Dialogue',transition:'Transition',visual:'Visual',audio:'Audio',cast:'Scene list',pagebreak:'Page break',synopsis:'Synopsis',note:'Note',alt:'Alternative line',beat:'Story beat',montage:'Montage',shot:'Montage item'};
const LIST_AFTER={scene:'action',action:'character',character:'dialogue',paren:'dialogue',dialogue:'action',transition:'scene',montage:'shot',shot:'action'};
const LIST_TYPES=['scene','action','character','paren','dialogue','transition'];
const LIST_LABELS=['Scene','Action','Character','Paren.','Dialogue','Transition'];
/* A format = page size, margins [top,right,bottom,left] in px at 96dpi, line height, type size, element set.

const FORMATS={
  hw:{id:'hw',name:'Hollywood',sub:'US Letter, master scenes, 54 lines a page',size:'letter',page:[816,1056],m:[96,96,96,144],lh:16,fs:16,cols:false,def:'action',types:LIST_TYPES,labels:LIST_LABELS,after:LIST_AFTER},
  eu:{id:'eu',name:'European',sub:'A4, single column',size:'A4',page:[794,1122],m:[96,96,96,144],lh:18,fs:16,cols:false,def:'action',types:LIST_TYPES,labels:LIST_LABELS,after:LIST_AFTER},
  av:{id:'av',name:'European TV',sub:'A4, Visual left, Audio right, new scene = new page',size:'A4',page:[794,1122],m:[96,72,96,72],lh:18,fs:14,cols:true,sceneBreak:true,def:'visual',
    types:['scene','visual','character','paren','dialogue','audio'],labels:['Heading','Visual','Speaker','Paren.','Dialogue','Audio'],
    after:{scene:'visual',visual:'character',audio:'visual',character:'dialogue',paren:'dialogue',dialogue:'visual',action:'character',transition:'visual',montage:'shot',shot:'visual'}}
};
let F=FORMATS.eu;
const RIGHT=['character','paren','dialogue','audio'];
const KEEP=['dialogue','action','visual','audio','shot'];
const AUDIO_WORDS='SFX|MUSIC|FX|AUDIO|ZVUK|HUDBA|SOUND|MUSIK|TON|MUZYKA|DŹWIĘK';
const AUDIO_RE=new RegExp('^\\s*('+AUDIO_WORDS+')\\s*:','i'),AUD_PFX=new RegExp('^\\s*('+AUDIO_WORDS+')\\s*:\\s*','i');

const AUD_STORE={hudba:'HUDBA',zvuk:'ZVUK'};
const kindOf=w=>/^(MUSIC|HUDBA|MUSIK|MUZYKA)$/i.test(w)?'hudba':'zvuk';
const cap=w=>w.charAt(0)+w.slice(1).toLowerCase();
let PW=794,PH=1122,MT=96,MB=96,LH=18;
let GAP=32,printing=false;
let AXJ=null;   /* actor export job in progress (see ACTOR SIDES in the ARCHITECTURE NOTES); null = a normal print */

function fitType(t,x){

}
const fitBlocks=bl=>bl.map(([t,x])=>[fitType(t,x),x]);
let cur=null,scale=1,stackH=PH,pagesN=1,lastPos=[];
let scenesInfo=[],charsInfo=[];
const prefs={theme:'auto',nums:'left',nav:true,focus:false,format:'eu',divider:false,wm:{on:false,title:true,recips:[],layers:[]},hf:{on:false,skip:true,h:['','',''],f:['','','']},rev:{on:false,round:1,base:[],date:''},zoom:'fit',lock:false,recent:[],tp:{on:true,credit:'',creditAuto:true,author:'',source:'',draft:'',contact:'',version:''},hide:{v:false,a:false,h:false},cont:true,tw:false,lang:'',ui:'',vocab:'',vterm:{}};

const SKIP_T='#stack,#seg,#visTog,#akind,.tip,.castpill,textarea,input,script,style,svg,[contenteditable],[data-user],.tx,.pc-name,.pc-t,.pc-a,.pc-log,.pn2,.tp-f,.tp-date,.bib-l li,.bib-h h3,#doc-title';

  const p=n.parentElement;if(!p||p.closest(SKIP_T))return;
  const r=trT.get(n);let src=n.nodeValue;if(r&&src===r.out)src=r.src;
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(src);if(!m[2])return;
  const d=STR[UI],tr=UI!=='en'&&d&&d[m[2]];
  if(tr){const out=m[1]+tr+m[3];if(n.nodeValue!==out)n.nodeValue=out;trT.set(n,{src,out})}
  else if(r&&n.nodeValue===r.out){n.nodeValue=src;trT.delete(n)}

  if(el.closest(SKIP_A))return;

    const r=rec&&rec[a];let src=cur;if(r&&cur===r.out)src=r.src;
    const d=STR[UI],tr=UI!=='en'&&d&&d[src];
    if(tr){if(cur!==tr)el.setAttribute(a,tr);(rec=rec||{})[a]={src,out:tr};trA.set(el,rec)}
    else if(r&&cur===r.out){el.setAttribute(a,src);delete rec[a]}}

function trTree(root){
  if(!root)return;

  if(UI==='en'&&!trT.size&&!trA.size)return;

  const dl=new Uint8Array(n),dr=new Uint8Array(n);

    if(ty0(bs[i])!=='character'||bs[i].dataset.dual!=='1')continue;
    let g=i-1;while(g>=0&&(ty0(bs[g])==='paren'||ty0(bs[g])==='dialogue'))g--;
    if(g<0||ty0(bs[g])!=='character'||dr[g])continue;

  }

    if(!!dl[i]!==('dl' in d)){if(dl[i])d.dl='1';else delete d.dl}
    if(!!dr[i]!==('dr' in d)){if(dr[i])d.dr='1';else delete d.dr}}

    const t=ty[i],p=ty[pv[i]];

    if(t==='alt'&&(p==='dialogue'||p==='alt'))return 0;
    if(isHead(t))return 2*LH;

/* Column line of the TV format: one .dv per page and per stretch without a scene heading. A scene heading spans both

function renderDiv(bs,pos){

function parseFountain(src){

}

async function exportAllVersions(tab){
  const list=vAll(),keep=EXSRC,used=new Set();let n=0;
  try{
    for(const v of list){
      EXSRC=isCur(v)?null:{v};
      const text=tab==='fdx'?toFdx():tab==='text'?toPlain():toFountain(),ext=EXT[tab];
      let name=exportFileName(ext),k=2;
      while(used.has(name.toLowerCase()))name=exportFileName(' ('+k++ +')'+ext);
      used.add(name.toLowerCase());
      if(!await saveFile(name,text,tab==='fdx'?'application/xml;charset=utf-8':undefined))break;

}

function rng(i,k,len){

  while((n=w.nextNode())){const L=n.length;if(!st&&k<pos+L){r.setStart(n,k-pos);st=true}if(st&&k+len<=pos+L){r.setEnd(n,k+len-pos);return r}pos+=L}

function paintFind(go){

  if(window.CSS&&CSS.highlights){CSS.highlights.delete('fb');if(m.length){const h=new Highlight();m.forEach(([i,k])=>{const r=rng(i,k,fF.value.length);if(r)h.add(r)});CSS.highlights.set('fb',h)}}
  if(go&&m.length)ed.children[m[fi][0]].scrollIntoView({block:'center',behavior:'auto'});

function moveSceneTo(k,to){

function mkRow(it){

  b.setAttribute('role',it.s?'menuitemcheckbox':it.c?'menuitemradio':'menuitem');
  b.innerHTML='<span class="ic">'+(it.c?ico('check',16):it.ic?ico(it.ic,16):'')+'</span><span class="lb"><span class="lt">'+esc(_(it.l))+(it.pth?'<span class="pth">'+esc(it.pth)+'</span>':'')+'</span>'+(it.d?'<span class="ds">'+esc(_(it.d))+'</span>':'')+'</span><span class="rt"></span>';
  return b;
}
function refreshRow(b){
  const it=b._it,rt=b.lastChild;
  if(it.s){const on=!!it.s();rt.innerHTML=(it.k?keysHtml(it.k):'')+'<span class="tsw'+(on?' on':'')+'"></span>';b.setAttribute('aria-checked',String(on))}
  else if(it.c)b.setAttribute('aria-checked',String(!!it.c()));
  else if(it.sub)rt.innerHTML='<span class="chv">'+ico('chevr',14)+'</span>';
  else if(it.v)rt.innerHTML='<span class="vl">'+esc(_(it.v()))+'</span>';
  else if(it.k)rt.innerHTML=keysHtml(it.k);
  b.setAttribute('aria-disabled',String(!!(it.dis&&it.dis())));
}
function fillList(p,items){
  p._list.replaceChildren();p._rows=[];
  items.forEach(it=>{
    if(it.when&&!it.when())return;
    if(it.sep){const d=document.createElement('div');d.className='msep';p._list.append(d);return}
    if(it.hd){const d=document.createElement('div');d.className='mhd';d.textContent=_(it.hd);p._list.append(d);return}
    const b=mkRow(it);refreshRow(b);p._list.append(b);p._rows.push(b)});
  if(!p._rows.length)p._list.innerHTML='<div class="mnone">No matching tool</div>';
}
function buildPanel(items,o={}){
  const p=document.createElement('div');p.className='mp'+(o.sub?' sub':'');p.setAttribute('role','menu');p._items=items;
  if(o.search){const s=document.createElement('div');s.className='msearch';s.innerHTML=ico('search',16)+'<input type="text" placeholder="'+o.search+'" autocomplete="off" spellcheck="false" aria-label="Search">';p.append(s);p._q=s.lastChild;
    p._q.addEventListener('input',()=>{closeFrom(1);const q=p._q.value.trim().toLowerCase();
      if(!q){fillList(p,items);return}
      const toks=q.split(/\s+/),res=[];
      const walk=(arr,path)=>arr.forEach(it=>{if(it.sep||it.hd||(it.when&&!it.when()))return;const sub=typeof it.sub==='function'?it.sub():it.sub;
        if(sub)return walk(sub,path?path+' › '+it.l:it.l);
        const hay=(path+' '+it.l+' '+(it.d||'')).toLowerCase();if(toks.every(t=>hay.includes(t)))res.push(Object.assign({},it,{pth:path,c:null}))});
      walk(o.all||items,'');fillList(p,res);if(p._rows[0])setHot(p,p._rows[0])})}
  const l=document.createElement('div');l.className='ml';p.append(l);p._list=l;fillList(p,items);return p;
}
function setHot(p,row){p._rows.forEach(r=>r.classList.toggle('hot',r===row));p._hot=row;if(row)row.scrollIntoView({block:'nearest'})}
function place(p,x,y,right){p.style.left=x+'px';p.style.top=y+'px';const r=p.getBoundingClientRect();
  if(r.right>innerWidth-8)p.style.left=Math.max(8,innerWidth-8-r.width)+'px';if(r.bottom>innerHeight-8)p.style.top=Math.max(8,innerHeight-8-r.height)+'px'}
function openMenu(id,btn){
  closeMenus(true);const m=MENUS.find(x=>x.id===id),items=id==='all'?menuAll():m?m.items():fmtItems(),srch=id==='tools'||id==='all';
  const p=buildPanel(items,{search:srch?'Search all menus…':null,all:srch?menuAll():null});mroot.append(p);
  const r=btn.getBoundingClientRect();place(p,id==='fmt'?r.right-p.offsetWidth:r.left,r.bottom+6);
  requestAnimationFrame(()=>p.classList.add('in'));stack_=[p];menuBtn=btn;btn.setAttribute('aria-expanded','true');
  if(p._q)setTimeout(()=>p._q.focus(),30);
}
function openSub(row,parent){
  const idx=stack_.indexOf(parent);closeFrom(idx+1);const it=row._it,sub=typeof it.sub==='function'?it.sub():it.sub;
  const p=buildPanel(sub,{sub:true});mroot.append(p);const pr=parent.getBoundingClientRect(),rr=row.getBoundingClientRect();
  let x=pr.right+3;if(x+p.offsetWidth>innerWidth-8){x=pr.left-p.offsetWidth-3;p.classList.add('r')}
  place(p,Math.max(8,x),rr.top-6);row.classList.add('open');p._row=row;requestAnimationFrame(()=>p.classList.add('in'));stack_.push(p);return p;
}
function closeFrom(i){while(stack_.length>i){const p=stack_.pop();if(p._row)p._row.classList.remove('open');p.classList.remove('in');setTimeout(()=>p.remove(),170)}}
function closeMenus(){clearTimeout(subT);closeFrom(0);if(menuBtn){menuBtn.setAttribute('aria-expanded','false');menuBtn=null}}
function actRow(row,p){
  const it=row._it;if(it.dis&&it.dis())return;
  if(it.sub){openSub(row,p);return}
  if(it.keep){it.f();stack_.forEach(q=>q._rows.forEach(refreshRow));return}
  closeMenus();ed.focus();setTimeout(()=>{runLog((it.pth?it.pth+' › ':'')+it.l);it.f()},0);
}
mroot.addEventListener('pointerover',e=>{
  const row=e.target.closest('.mi'),p=e.target.closest('.mp');if(!row||!p)return;setHot(p,row);clearTimeout(subT);
  const idx=stack_.indexOf(p);if(row._it.sub){if(stack_[idx+1]&&stack_[idx+1]._row===row)return;subT=setTimeout(()=>openSub(row,p),stack_.length>idx+1?40:110)}

function analyze(){
  const bs=[...ed.children],scenes=[],chars=new Map(),locs=new Map();let sc=null,spk='',dW=0,aW=0;
  bs.forEach(b=>{const t=b.dataset.t,x=b.textContent.trim();
    if(t==='montage'){const mt=montTitle(x);sc={io:'',loc:mt?V('mon')+' \u2013 '+mt:V('mon'),time:'',words:0,dw:0,aw:0,seq:[],mont:true,beat:beatOf(bs,bs.indexOf(b))};scenes.push(sc);spk='';return}
    if(t==='scene'){const m=x.toUpperCase().match(/^(INT\.?\/EXT|EXT\.?\/INT|WN\.?\/ZN|I\/E|INT|EXT|EST|WN|ZN)[\.\s\/]*(.*?)(?:\s+[–—-]\s*([^–—-]+))?$/);
      sc={io:m?sceneId(m[1]):'',loc:((m?m[2]:x)||'').trim()||'—',time:m&&m[3]?m[3].trim():'',words:0,dw:0,aw:0,seq:[],beat:beatOf(bs,bs.indexOf(b))};scenes.push(sc);spk='';
      const L=locs.get(sc.loc)||{n:0,io:new Set(),times:new Set()};L.n++;if(sc.io)L.io.add(sc.io);if(sc.time)L.times.add(sc.time);locs.set(sc.loc,L);return}
    if(HID(t)||t==='pagebreak'||t==='cast')return;const w=wc(x);if(sc)sc.words+=w;
    if(t==='shot'){const p=shotPlaceOf(b)||(locParse(b.textContent).io?b.textContent.trim().toUpperCase():'');if(p){const lp=locParse(p),k=lp.loc||p,L=locs.get(k)||{n:0,io:new Set(),times:new Set()};L.n++;if(lp.io)L.io.add(lp.io);if(lp.time)L.times.add(lp.time);locs.set(k,L)}}
    if(t==='character'){spk=baseName(x);if(spk){const c=chars.get(spk)||{cues:0,words:0,sc:new Set()};c.cues++;if(sc){c.sc.add(scenes.length);sc.seq.push(spk)}chars.set(spk,c)}}
    else if(t==='dialogue'){dW+=w;if(sc)sc.dw+=w;if(spk&&chars.get(spk))chars.get(spk).words+=w}
    else if(t==='paren'){}else{spk='';if(t==='action'||t==='visual'||t==='audio'||t==='shot'){aW+=w;if(sc)sc.aw+=w}}});
  const pairs=new Map(),cn=sceneCast(),pk=(x,y)=>{const o=[x,y].sort(),key=o.join('|'),p=pairs.get(key)||{a:o[0],b:o[1],sc:0,ex:0};pairs.set(key,p);return p};
  scenes.forEach((s,k)=>{
    s.dur=s.dw/2.3+s.aw/3;const names=cn[k]?cn[k].det:[];
    names.forEach(n=>{const c=chars.get(n);if(c)c.time=(c.time||0)+s.dur});
    for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++)pk(names[i],names[j]).sc++;
    for(let i=1;i<s.seq.length;i++)if(s.seq[i]!==s.seq[i-1])pk(s.seq[i],s.seq[i-1]).ex++;
  });
  return{pairs:[...pairs.values()].sort((p,q)=>(q.ex-p.ex)||(q.sc-p.sc)),scenes,chars:[...chars.entries()].sort((a,b)=>b[1].words-a[1].words),locs:[...locs.entries()].sort((a,b)=>b[1].n-a[1].n),dW,aW};
}

/* "Ctrl Alt N" style combo of a key event; letters follow the keyboard layout, digits and fallbacks use the physical key */
function evCombo(e){
  const c=e.code||'',kk=e.key||'';let k='';
  if(/^Digit\d$/.test(c))k=c[5];
  else if(/^[a-z]$/i.test(kk))k=kk.toUpperCase();
  else if(/^Key[A-Z]$/.test(c))k=c[3];
  else if(/^F\d{1,2}$/.test(kk))k=kk;
  else k=({ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Enter:'Enter',Tab:'Tab',' ':'Space',Home:'Home',End:'End',PageUp:'PageUp',PageDown:'PageDown',Insert:'Insert'})[kk]||(kk.length===1?kk:'');
  if(!k)return'';
  const m=[];if(e.ctrlKey||e.metaKey)m.push('Ctrl');if(e.altKey)m.push('Alt');if(e.shiftKey)m.push('Shift');
  return m.concat(k).join(' ');
}

  const other=ACT.find(a=>a.id!==id&&keyOf(a.id)===c);

  if(other){prefs.keys=prefs.keys||{};prefs.keys[other.id]='';toast(_('Moved from “{name}”',{name:_(actLabel(other))}))}
