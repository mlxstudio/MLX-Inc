/* ================= versions =================
   MODEL. Every document has its own version LINE: P.vl[doc] = {cur, seq} (only doc 'script' is used today). P.versions[] holds the versions of all
   lines, newest first, each with v.doc (default 'script'). The CURRENT version is the live document: its text is P.doc.b + the title, written by
   saveProject() on every change, so there is no unsaved state; its own b is null. "New version" and restore FREEZE the current version (b = indexes
   into the shared block pool P.pool, vals = shared project values such as the logline) and add a new current one. A frozen version is never edited.
   Safety backups (P.backups[]) share the pool but are NOT versions; undo history (H) is separate again. */
const vdock=$('#vdock');
const TAGS=[['Draft','#8a9a9d'],['Review','#d9a21b'],['Director','#7a5ad8'],['Approved','#1f9d6a'],['Final','#0b7d8a']];
const tagCol=t=>(TAGS.find(x=>x[0]===t)||[0,'var(--fg-soft)'])[1];
let _pm=null,_pmP=null;
const poolMap=()=>{if(_pmP!==P||!_pm||_pm.size!==P.pool.length){_pm=new Map(P.pool.map(([t,x],i)=>[t+'\u0001'+x,i]));_pmP=P}return _pm};
function pack(b){const m=poolMap();return b.map(([t,x])=>{const k=t+'\u0001'+x;let i=m.get(k);if(i===undefined){i=P.pool.push([t,x])-1;m.set(k,i)}return i})}
const unpack=v=>(v.b||[]).map(i=>P.pool[i]||['action','']);
const sameIds=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
function sameBlocks(a,b){if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i][0]!==b[i][0]||a[i][1]!==b[i][1])return false;return true}
const vLine=doc=>P&&P.vl?P.vl[doc||'script']:null;
const vAll=doc=>P.versions.filter(v=>(v.doc||'script')===(doc||'script'));
const curVer=doc=>{const l=vLine(doc);return l?P.versions.find(v=>v.id===l.cur)||null:null};
const isCur=v=>{const l=vLine(v.doc);return !!l&&l.cur===v.id};
const vById=id=>P.versions.find(v=>v.id===id);
const bkById=id=>(P.backups||[]).find(v=>v.id===id);
const manual=()=>P&&P.vl?vAll('script').filter(v=>!isCur(v)):[];/* frozen versions of the script (the export picker adds the current one itself) */
const vBlocks=v=>isCur(v)?blocksData():unpack(v);
const vTitle=v=>isCur(v)?titleEl.value:(v.title||'');
const vFmt=v=>isCur(v)?prefs.format:v.f;
const vName=n=>{const m=/^Version (\d+)$/.exec(n||'');return m?_('Version {n}',{n:+m[1]}):(n==='Automatic'||n==='Before replace'?_(n):n)};
const vWhen=t=>fmtDateTime(t,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
/* what the rest of the app (title page, export names, later the front page) reads: the current version of a document */
function verInfo(doc){const v=P&&P.vl?curVer(doc):null;return v?{doc:doc||'script',id:v.id,n:v.n,name:v.name,label:vName(v.name),tag:v.tag||'',note:v.note||'',count:vAll(doc).length}:null}
/* the title page shows the version only once there is something to tell apart (a second version, or a name the user chose) */
function verShown(v){return v.n>1||vAll(v.doc).length>1||v.name!=='Version '+v.n}
/* keep the numbers of the current version fresh (called from saveProject) */
function vSync(){const v=P&&P.vl?curVer('script'):null;if(!v)return;v.w=LASTW;v.sc=scenesInfo.length;v.f=prefs.format;v.title=titleEl.value;v.u=P.updated||Date.now()}
function vFreeze(v){const b=blocksData();v.b=pack(b);v.title=titleEl.value;v.f=prefs.format;v.w=wordsOf(b);v.sc=b.filter(x=>isHead(x[0])).length;v.vals={logline:P.logline||''};v.fz=Date.now()}
function vMake(o){
  const l=vLine('script'),n=++l.seq,b=blocksData();
  const v={id:uid()+uid(),doc:'script',n,name:(o.name||'').trim()||'Version '+n,note:(o.note||'').trim(),tag:o.tag||'',lock:false,t:Date.now(),from:o.from||'',title:titleEl.value,f:prefs.format,b:null,w:wordsOf(b),sc:b.filter(x=>isHead(x[0])).length,vals:{}};
  if(o.rf)v.rf=o.rf;
  P.versions.unshift(v);l.cur=v.id;return v;
}
const vRefresh=()=>{updVerChip();if(vdock.classList.contains('open'))renderVDock()};
/* NEW VERSION: freeze the current one, carry on in a copy */
function newVersion(o){
  if(!canWrite()||!P.vl)return null;commit();
  const cv=curVer();if(!cv)return null;
  if(!blocksData().some(([t,x])=>x.trim())){toast('This version is still empty');return null}
  vFreeze(cv);if(o.lock)cv.lock=true;
  const nv=vMake({name:o.name,note:o.note,tag:o.tag,from:cv.id});
  vSync();saveProject();vRefresh();return nv;
}
/* RESTORE: never overwrites. The current version is frozen as it is and the restored text becomes a new current version. */
function restoreInto(blocks,title,f,rf){
  if(!canWrite()||!P.vl)return;commit();
  const cv=curVer();if(!cv)return;
  if(sameBlocks(blocks,blocksData())&&(title||'')===titleEl.value){toast('Already the same as the current version');return}
  const oldFmt=prefs.format;
  vFreeze(cv);
  const nv=vMake({from:cv.id,rf});
  if(FORMATS[f]&&f!==prefs.format){prefs.format=f;applyFormat()}
  loadBlocks(blocks,title,true);
  vSync();commit();store();vRefresh();
  toastAct(_('Restored as {name}. {old} is untouched.',{name:vName(nv.name),old:vName(cv.name)}),'Undo',()=>undoRestore(nv.id,cv.id,blocks,title,oldFmt));
}
function undoRestore(nvId,prevId,blocks,title,fmt){
  const nv=vById(nvId),prev=vById(prevId),l=vLine('script');
  if(!nv||!prev||!l||l.cur!==nvId||!canWrite())return;
  if(!sameBlocks(blocks,blocksData())||(title||'')!==titleEl.value){toast('Edited since restoring. Nothing was undone');return}
  const pb=unpack(prev),pt=prev.title||'';
  P.versions=P.versions.filter(v=>v.id!==nvId);l.cur=prevId;if(l.seq===nv.n)l.seq=nv.n-1;prev.b=null;
  if(FORMATS[fmt]&&fmt!==prefs.format){prefs.format=fmt;applyFormat()}
  loadBlocks(pb,pt,true);vSync();commit();store();vRefresh();toast('Undone');
}
function restoreVersion(id){const v=vById(id);if(!v||isCur(v))return;restoreInto(unpack(v),v.title||'',v.f,v.n)}
function restoreBackup(id){const v=bkById(id);if(!v)return;restoreInto(unpack(v),v.title||'',v.f,'b')}
/* SAFETY BACKUPS: automatic copies, apart from versions (every 5 min, before an import or a replace) */
function addBackup(name){
  if(!P||!P.vl||!canWrite())return null;
  const b=blocksData();if(!b.some(([t,x])=>x.trim()))return null;
  const ids=pack(b),last=(P.backups||[])[0];
  if(last&&sameIds(last.b,ids)&&last.title===titleEl.value)return null;
  P.backups=P.backups||[];
  P.backups.unshift({id:uid()+uid(),t:Date.now(),name:name||'Automatic',title:titleEl.value,f:prefs.format,b:ids,w:wordsOf(b),sc:b.filter(x=>isHead(x[0])).length});
  P.backups=P.backups.slice(0,15);
  saveProject();if(vdock.classList.contains('open'))renderVDock();return true;
}
/* old call sites (before import, before replace, every five minutes) */
function addSnap(name){return !!addBackup(name)}
function saveSnap(){saveVersionDlg()}
function renderHist(){}
setInterval(()=>{if(!document.hidden&&canWrite())addBackup('Automatic')},300000);

/* dock */
function openVDock(){if(!canWrite())return;closeDock();closeMenus();renderVDock();vdock.classList.add('open')}
function closeVDock(){vdock.classList.remove('open')}
const vDelta=d=>d?' <span class="vdelta '+(d>0?'up':'dn')+'">'+(d>0?'+':'−')+Math.abs(d)+'</span>':'';
const vRf=v=>v.rf?'<span class="vrf">'+esc(v.rf==='b'?_('Restored from a backup'):_('Restored from Version {n}',{n:v.rf}))+'</span>':'';
function renderVDock(){
  if(!P||!P.vl)return;
  const cv=curVer();if(!cv)return;
  const older=vAll().filter(v=>v!==cv),bk=P.backups||[];
  const row=(v,i)=>{
    const prev=older[i+1],d=prev?v.w-prev.w:0;
    return '<div class="vr" data-id="'+v.id+'" style="--tc:'+tagCol(v.tag)+';animation-delay:'+Math.min(i,8)*18+'ms"><i class="vt"></i><div class="vm"><b><span>'+esc(vName(v.name))+'</span>'+(v.lock?ico('lock',12):'')+'</b><small>'+(v.tag?'<span class="tg">'+esc(v.tag)+'</span>':'')+vWhen(v.t)+' · '+_n('word',v.w)+vDelta(d)+'</small>'+vRf(v)+(v.note?'<span class="vn">'+esc(v.note)+'</span>':'')+'</div><div class="vb"><button class="icon sm" data-a="cmp" title="Compare with current" aria-label="Compare">'+ico('compare',15)+'</button><button class="icon sm" data-a="res" title="Restore as new version" aria-label="Restore">'+ico('undo',15)+'</button><button class="icon sm" data-a="more" data-pm title="More" aria-label="More" aria-haspopup="menu">'+ico('more',15)+'</button></div></div>'};
  const brow=(v,i)=>'<div class="vr auto" data-id="'+v.id+'" data-k="b" style="animation-delay:'+Math.min(i,8)*18+'ms"><i class="vt"></i><div class="vm"><b><span>'+esc(vName(v.name))+'</span></b><small>'+vWhen(v.t)+' · '+_n('word',v.w)+'</small></div><div class="vb"><button class="icon sm" data-a="cmp" title="Compare with current" aria-label="Compare">'+ico('compare',15)+'</button><button class="icon sm" data-a="res" title="Restore as new version" aria-label="Restore">'+ico('undo',15)+'</button></div></div>';
  let h='<div class="dh"><b>Versions</b><button class="icon" data-a="close" aria-label="Close">'+ico('x')+'</button></div><div class="db">'+
    '<div class="vwork" data-id="'+cv.id+'"><div class="vcur"><b>'+esc(vName(cv.name))+'</b><span class="vbadge">Current</span>'+(cv.tag?'<span class="tg" style="font:650 10px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:'+tagCol(cv.tag)+'">'+esc(cv.tag)+'</span>':'')+'</div>'+
    '<div class="vs"><span class="vdot"></span><span>'+esc(_('Saved as you write'))+' · '+esc(ago(P.updated||Date.now()))+' · '+_n('word',LASTW)+(older[0]?vDelta(LASTW-older[0].w):'')+'</span></div>'+vRf(cv)+(cv.note?'<span class="vn">'+esc(cv.note)+'</span>':'')+
    '<div class="vb2"><button class="btn" data-a="save">'+ico('camera',15)+'New version</button><button class="btn ghost" data-a="cmpw"'+(older.length||bk.length?'':' disabled')+'>Compare…</button><button class="icon sm" data-a="editc" title="Edit name and note…" aria-label="Edit name and note…">'+ico('edit',15)+'</button><button class="icon sm" data-a="more" data-pm title="More" aria-label="More" aria-haspopup="menu">'+ico('more',15)+'</button></div></div>';
  h+='<div class="vsec"><span>Earlier versions</span></div>'+(older.length?'<div class="vtl">'+older.map(row).join('')+'</div>':'<p class="muted" style="font-size:12.5px;line-height:1.5;margin:6px 4px">Everything you write is saved straight into the current version. New version freezes it and you carry on in a copy. Any earlier version can be compared or restored.</p>');
  if(bk.length)h+='<div class="vsec"><span>'+esc(_('Safety backups · {n}',{n:bk.length}))+'</span><button data-a="auto">'+(vdock._auto?'Hide':'Show')+'</button></div>'+(vdock._auto?'<div class="vtl">'+bk.map(brow).join('')+'</div>':'')+'<p class="muted" style="font-size:12px;margin:2px 4px">Automatic copies, kept apart from your versions. The last 15 are kept, plus one before every import or replace.</p>';
  vdock.innerHTML=h+'</div>';
}
function verItems(id){
  const v=vById(id);if(!v)return[];const c=isCur(v);
  return[...(c?[]:[{l:'Compare with current',ic:'compare',f:()=>openCompare(id,'work')}]),{l:'Compare with…',ic:'compare',f:()=>openCompare(id)},
    ...(c?[]:[{l:'Restore as new version',ic:'undo',d:'Nothing is overwritten',f:()=>restoreVersion(id)}]),
    {l:'Make a new script from this',ic:'branch',d:'Branch: the original stays as it is',f:()=>branchVersion(id)},{sep:1},
    {l:'Edit name and note…',ic:'edit',f:()=>editVersion(id)},
    ...(c?[]:[{l:v.lock?'Unlock':'Lock',ic:'lock',f:()=>{v.lock=!v.lock;saveProject();renderVDock()}}]),
    {l:'Download as Fountain',ic:'download',f:()=>dlVersion(id)},
    ...(c?[]:[{sep:1},{l:'Delete',ic:'trash',f:()=>delVersion(id)}])];

vdock.addEventListener('click',e=>{

function branchVersion(id){
  const v=vById(id);if(!v)return;commit();saveProject();
  const f=vFmt(v),dp=docPrefs();dp.format=FORMATS[f]?f:dp.format;
  const np=newProject({title:(vTitle(v)||P.title)+' – '+vName(v.name),logline:P.logline,blocks:vBlocks(v),prefs:dp,chars:clone(P.chars),actors:clone(P.actors||{}),chDismiss:clone(P.chDismiss||[]),cast:clone(P.cast||[])});
  np.doc.title=vTitle(v)?(vTitle(v)+' – '+vName(v.name)):'';persist(np);
  closeVDock();openProject(np.id);toast(_('New script made from “{name}”',{name:vName(v.name)}));
}
function dlVersion(id){
  const v=vById(id);if(!v)return;
  try{downloadText(exportFileName('.fountain',{ver:vName(v.name)||'version'}),toFountain(vBlocks(v).filter(([t,x])=>x.trim()!==''||t==='pagebreak'),vTitle(v)),undefined,n=>toast(_('Saved {name}',{name:n})))}

/* ---------- compare ---------- */
function diffBlocks(A,B){
  const ka=A.map(([t,x])=>t+'\u0001'+x),kb=B.map(([t,x])=>t+'\u0001'+x);
  let s=0;while(s<ka.length&&s<kb.length&&ka[s]===kb[s])s++;
  let ea=ka.length,eb=kb.length;while(ea>s&&eb>s&&ka[ea-1]===kb[eb-1]){ea--;eb--}
  const n=ea-s,m=eb-s,ops=[];
  for(let i=0;i<s;i++)ops.push({k:'=',a:A[i]});
  if(n*m>6e6||!n||!m){for(let i=0;i<n;i++)ops.push({k:'-',a:A[s+i]});for(let j=0;j<m;j++)ops.push({k:'+',a:B[s+j]})}
  else{
    const w=m+1,L=new Uint16Array((n+1)*w);
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*w+j]=ka[s+i]===kb[s+j]?L[(i+1)*w+j+1]+1:Math.max(L[(i+1)*w+j],L[i*w+j+1]);
    let i=0,j=0;
    while(i<n&&j<m){if(ka[s+i]===kb[s+j]){ops.push({k:'=',a:A[s+i]});i++;j++}else if(L[(i+1)*w+j]>=L[i*w+j+1]){ops.push({k:'-',a:A[s+i]});i++}else{ops.push({k:'+',a:B[s+j]});j++}}
    while(i<n)ops.push({k:'-',a:A[s+i++]});while(j<m)ops.push({k:'+',a:B[s+j++]});
  }
  for(let i=ea;i<ka.length;i++)ops.push({k:'=',a:A[i]});
  return ops;
}
const toks=x=>strip(x).split(/(\s+)/).filter(t=>t!=='');
function wordDiff(x,y){
  const a=toks(x),b=toks(y);
  if(a.length*b.length>160000)return'<del>'+esc(a.join(''))+'</del><ins>'+esc(b.join(''))+'</ins>';
  const n=a.length,m=b.length,w=m+1,L=new Uint16Array((n+1)*w);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*w+j]=a[i]===b[j]?L[(i+1)*w+j+1]+1:Math.max(L[(i+1)*w+j],L[i*w+j+1]);
  let i=0,j=0,o='',dl='',ins='';const fl=()=>{if(dl){o+='<del>'+esc(dl)+'</del>';dl=''}if(ins){o+='<ins>'+esc(ins)+'</ins>';ins=''}};
  while(i<n&&j<m){if(a[i]===b[j]){fl();o+=esc(a[i]);i++;j++}else if(L[(i+1)*w+j]>=L[i*w+j+1])dl+=a[i++];else ins+=b[j++]}
  while(i<n)dl+=a[i++];while(j<m)ins+=b[j++];fl();return o;
}
const jac=(x,y)=>{const a=new Set(strip(x).toLowerCase().split(/\s+/)),b=new Set(strip(y).toLowerCase().split(/\s+/));let k=0;a.forEach(t=>{if(b.has(t))k++});return k/Math.max(1,a.size+b.size-k)};
/* turn raw ops into display rows: pair a removed block with the added block that replaced it */
function diffRows(ops){
  const rows=[];let i=0;
  while(i<ops.length){
    if(ops[i].k==='='){rows.push({k:'=',t:ops[i].a[0],x:ops[i].a[1]});i++;continue}
    const dels=[],adds=[];let j=i;while(j<ops.length&&ops[j].k!=='='){(ops[j].k==='-'?dels:adds).push(ops[j].a);j++}
    const used=new Set(),pair=new Map();let from=0;
    dels.forEach((d,di)=>{for(let ai=from;ai<adds.length;ai++){if(used.has(ai))continue;if(adds[ai][0]===d[0]&&jac(d[1],adds[ai][1])>=.3){pair.set(di,ai);used.add(ai);from=ai+1;break}}});
    let ai=0;
    dels.forEach((d,di)=>{
      const p=pair.get(di);
      if(p!==undefined){while(ai<p){if(!used.has(ai))rows.push({k:'+',t:adds[ai][0],x:adds[ai][1]});ai++}rows.push({k:'~',t:d[0],x:wordDiff(d[1],adds[p][1]),raw:true});ai=p+1}

    for(;ai<adds.length;ai++)if(!used.has(ai))rows.push({k:'+',t:adds[ai][0],x:adds[ai][1]});
    i=j;

/* first mention of every character in the action or visual text, as ranges in the plain text of each block */
function faCompute(types,texts,names){
  const res=new Map(),pm=new Map();

  aChars(id).forEach(k=>{s.add(baseName(k));((prof(k)||{}).al||[]).forEach(x=>{const b=baseName(x);if(b)s.add(b)})});
  return s;
}
/* what an actor's copy contains: block indexes to mark, scene headings to keep, counts for the dialog */
function actorPlan(id,own,scs){
  own=own||axOwn(id);scs=scs||sceneCast();
  const bs=[...ed.children],hl=new Set(),scenes=new Set();let spk='',head=-1,cues=0,words=0;
  scs.forEach(s=>{if(s.names.some(n=>own.has(baseName(n))))scenes.add(s.i)});
  bs.forEach((b,i)=>{
    const t=b.dataset.t;
    if(isHead(t)){spk='';head=i;return}
    if(t==='character'){spk=baseName(b.textContent);if(own.has(spk)){hl.add(i);cues++;if(head>=0)scenes.add(head)}}
    else if(t==='paren'||t==='dialogue'||t==='alt'){if(own.has(spk)){hl.add(i);if(t==='dialogue')words+=wc(b.textContent)}}
    else if(!['cast','synopsis','note','beat','pagebreak'].includes(t))spk='';
  });
  return{hl,scenes,cues,words,nScenes:scenes.size};
}
/* file name configuration for actor sides: the user's own naming (parts, separator, pattern) plus the actor, and the scope when both are made */
function axNameCfg(both){
  const c=fnCfg();
  (both?['actor','scope']:['actor']).forEach(k=>{
    if(c.custom&&c.custom.trim()){if(!new RegExp('\\{'+k+'\\}').test(c.custom))c.custom=c.custom.trim()+c.sep+'{'+k+'}'}
    else if(!c.parts.includes(k))c.parts.push(k)});
  return c;
}
const axScopeLabel=sc=>_(sc==='full'?'Full script':'Their scenes');
function axJobs(ids,o){
  const scs=sceneCast(),lb=aLabels(),both=o.mode==='both',cfg=axNameCfg(both),used=new Set(),jobs=[],skipped=[];
  ids.forEach(id=>{
    if(!actorMap()[id])return;
    const own=axOwn(id),pl=actorPlan(id,own,scs);
    if(!pl.cues&&!pl.nScenes){skipped.push(lb[id]);return}
    (both?['full','scenes']:[o.mode]).forEach(sc=>{
      if(sc==='scenes'&&!pl.nScenes)return;
      const mark=aMark(id);let nm=exportBaseName({cfg,actor:mark,scope:axScopeLabel(sc)}),k=2;const b0=nm;
      while(used.has(nm.toLowerCase()))nm=b0+' ('+k+++')';
      used.add(nm.toLowerCase());
      jobs.push({id,own,mark,scope:sc,file:nm,label:lb[id],opt:o});
    });
  });
  return{jobs,skipped};
}
/* beforeprint: mark the copy of this one actor */
function axBegin(){
  const j=AXJ;if(!j||j.on)return;j.on=true;
  const o=j.opt||axOpt(),bs=[...ed.children],pl=actorPlan(j.id,j.own);
  bs.forEach((b,i)=>{if(pl.hl.has(i))b.classList.add('axh')});
  app.classList.add('ax-'+o.hl);
  if(j.scope==='scenes'){
    let keep=false,num=0;
    bs.forEach((b,i)=>{
      if(isHead(b.dataset.t)){num++;keep=pl.scenes.has(i);if(keep)b.style.setProperty('counter-set','sc '+num)}   /* real scene number, not 1,2,3 */
      if(!keep)b.dataset.axo='1';
    });
  }
  /* the existing watermark engine does the work: the actor is the one recipient, {name} carries the mark; the script's own layers stay */
  j.wmSave=prefs.wm;
  const w=clone(prefs.wm);
  if(o.wm){
    const has=w.on&&w.layers.some(l=>l.on&&l.type==='text'&&/\{name\}/.test(l.text));
    if(!w.on)w.layers=[];
    if(!has)w.layers.push(Object.assign(wmDef(),{text:'{name}',mode:'tile',size:20,alpha:9,caps:false}));
    w.on=true;w.recips=[j.mark];
  }else w.recips=[];                       /* no recipient copies: one clean file */
  prefs.wm=w;wmRev++;renderWM.key='';
}
/* afterprint: nothing of the export stays behind */
function axEnd(){
  const j=AXJ;if(!j||!j.on)return;j.on=false;
  [...ed.children].forEach(b=>{b.classList.remove('axh');delete b.dataset.axo;b.style.removeProperty('counter-set')});
  app.classList.remove('ax-yellow','ax-grey','ax-bar');
  if(j.wmSave){prefs.wm=j.wmSave;j.wmSave=null}
  wmRev++;renderWM.key='';try{renderTp()}catch(e){}
}
function axPrint(jb){
  return new Promise(res=>{
    AXJ=jb;jb.on=false;jb.fin=()=>{jb.fin=null;res(true)};
    try{titleForPrint();window.print()}catch(e){jb.fin=null;titleRestore();res(false)}
  });
}
let axBusy=false;
async function runActorExport(ids,o){
  if(axBusy||AXJ)return;
  const{jobs,skipped}=axJobs(ids,o);
  if(!jobs.length){toast('Nothing to export for these actors');return}
  axBusy=true;closeAll();let done=0,stop=false;
  try{
    await new Promise(r=>setTimeout(r,120));
    for(let k=0;k<jobs.length;k++){
      const ok=await axPrint(jobs[k]);AXJ=null;
      if(!ok){toast('Printing is not available here');break}
      done++;
      if(k<jobs.length-1){
        stop=false;toastAct(_('{done} of {n} · next: {name}',{done,n:jobs.length,name:jobs[k+1].file}),'Stop',()=>{stop=true});
        await new Promise(r=>setTimeout(r,2400));
        if(stop)break;
      }
    }
  }finally{AXJ=null;axBusy=false}
  if(done)toast(_('Actor sides: {n}',{n:_n('file',done)})+(skipped.length?' · '+_('left out, not in the script: {names}',{names:skipped.join(', ')}):''));
}
function openActorExport(pre,back){
  if(!canWrite()){toast('Open a script first');return}
  commit();
  const back_=back||closeAll;
  const lb=aLabels(),scs=sceneCast();
  const rows=Object.values(actorMap()).map(a=>{const own=axOwn(a.id),pl=actorPlan(a.id,own,scs);
    return{id:a.id,label:lb[a.id],mark:aMark(a.id),chars:aChars(a.id),pl,ok:pl.cues>0||pl.nScenes>0}}).sort((x,y)=>x.label.localeCompare(y.label));
  const sel=new Set(pre&&rows.some(r=>r.id===pre&&r.ok)?[pre]:rows.filter(r=>r.ok).map(r=>r.id));
  const o=axOpt();
  const go=()=>{const ids=rows.filter(r=>sel.has(r.id)).map(r=>r.id);if(!ids.length){toast('Choose at least one actor');return}axSave(o);runActorExport(ids,o)};
  showDlg('Actor sides',db=>{
    if(!rows.length){
      db.innerHTML='<div class="bib-e"><b>'+_('No actors yet')+'</b><span>'+_('Add the actors in the character hub and link each one to the characters they play. Then each actor gets a copy of their own.')+'</span></div>';return}
    const seg=(k,opts)=>'<span class="seg2" data-seg="'+k+'">'+opts.map(([v,l])=>'<button type="button" data-v="'+v+'" aria-pressed="'+(o[k]===v)+'">'+_(l)+'</button>').join('')+'</span>';
    db.innerHTML='<span class="lab" style="margin-top:2px">Actors</span><div class="axl" id="axL"></div><div class="axt"><button type="button" class="xbtn" data-a="all">'+_('Select all')+'</button><button type="button" class="xbtn" data-a="none">'+_('None')+'</button></div>'+
      '<span class="lab">What to export</span>'+seg('mode',[['full','Full script'],['scenes','Their scenes'],['both','Both']])+'<p class="muted axn" id="axMn"></p>'+
      '<span class="lab">Highlight</span>'+seg('hl',[['yellow','Soft yellow'],['grey','Grey'],['bar','Margin bar only']])+'<p class="muted axn">'+_('A bar in the margin marks each line, so it also reads in black and white.')+'</p>'+
      '<label class="xopt" style="margin-top:12px"><input type="checkbox" class="sw" id="axW"'+(o.wm?' checked':'')+'>'+_('Watermark with the actor’s name')+'</label><p class="muted axn">'+_('Surname only; a shared surname gets the first initial. Your own watermark layers stay as they are.')+'</p>'+
      '<div id="axF"></div><p class="muted axn">'+_('The script is never changed: highlights and watermarks exist only in the files. No contact details are included.')+'</p>';
    const L=$('#axL'),foot=()=>dlg.querySelector('.df .btn:last-child');
    const first=()=>rows.find(r=>sel.has(r.id))||rows.find(r=>r.ok)||rows[0];
    const preview=()=>{const f=$('#axF');f.replaceChildren();const r=first(),both=o.mode==='both';
      f.append(fnPanel('pdf',{act:true,redo:preview,name:()=>exportBaseName({cfg:axNameCfg(both),actor:r?r.mark:'',scope:axScopeLabel(both?'full':o.mode==='scenes'?'scenes':'full')})+'.pdf'}))};
    const upd=()=>{
      L.innerHTML=rows.map(r=>'<label class="axr'+(r.ok?'':' off')+'"><input type="checkbox" class="sw" data-id="'+r.id+'"'+(sel.has(r.id)?' checked':'')+(r.ok?'':' disabled')+'><span><b data-user>'+esc(r.label)+'</b><small data-user>'+esc(!r.chars.length?_('No character linked'):!r.ok?_('Not in the script'):r.chars.join(', ')+' · '+_n('scene',r.pl.nScenes)+' · '+_n('cue',r.pl.cues))+'</small></span>'+(r.ok?'<em data-user title="'+esc(_('Watermark'))+'">'+esc(r.mark)+'</em>':'')+'</label>').join('');
      $('#axMn').textContent=_(o.mode==='full'?'The whole script, with this actor’s lines marked.':o.mode==='scenes'?'Only the scenes this actor is in, with the original scene numbers.':'Two files per actor: the whole script and their scenes.');
      const n=axJobs(rows.filter(r=>sel.has(r.id)).map(r=>r.id),o).jobs.length;
      const b=foot();if(b){b.textContent=_('Export')+' · '+_n('file',n);b.disabled=!n}
      preview();
    };
    db.onchange=e=>{const t=e.target;
      if(t.dataset.id){t.checked?sel.add(t.dataset.id):sel.delete(t.dataset.id);upd()}
      else if(t.id==='axW'){o.wm=t.checked}};
    db.onclick=e=>{
      const sb=e.target.closest('[data-seg] button');if(sb){const k=sb.parentNode.dataset.seg;o[k]=sb.dataset.v;sb.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===sb)));upd();return}
      const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='all'){rows.forEach(r=>{if(r.ok)sel.add(r.id)});upd()}else if(b.dataset.a==='none'){sel.clear();upd()}};
    upd();setTimeout(upd,0);   /* the footer button exists only after this render: refresh its file count once more */
  },{w:560,foot:[['Cancel',back_,'ghost'],['Export',go]]});
}

Object.assign(STR.cs,{"Scripts were updated to the new storage format. Your originals are kept as a backup.":"Scénáře byly převedeny do nového formátu úložiště. Originály zůstávají uložené jako záloha.","These scripts could not be converted and were left untouched: {names}":"Tyto scénáře se nepodařilo převést a zůstaly beze změny: {names}","Some stored scripts could not be read and were skipped: {n}":"Některé uložené scénáře nešlo přečíst a byly přeskočeny: {n}","Some scripts were made by a newer version of the app and were left untouched: {n}":"Některé scénáře vytvořila novější verze aplikace a zůstaly beze změny: {n}","Could not save to disk. Your work is kept and saving will be retried. Download a project file to be safe.":"Uložení na disk se nezdařilo. Práce je zachována a ukládání se zopakuje. Pro jistotu stáhněte soubor projektu.","This file was made by a newer version of the app.":"Tento soubor vytvořila novější verze aplikace.","This script was made by a newer version of the app.":"Tento scénář vytvořila novější verze aplikace.","Only the script was imported here. Use Import on the home screen for the whole project.":"Importován byl jen scénář. Celý projekt naimportujete na úvodní obrazovce.","The copy on disk differs from the one in memory for: {n}":"Kopie na disku se liší od té v paměti u: {n}"});
/* ---------- start ---------- */
(async function boot(){
  try{await Vault.init()}catch(e){}
  Vault.onFail(()=>toastAct('Could not save to disk. Your work is kept and saving will be retried. Download a project file to be safe.','OK',()=>{}));
  const ui=lsGet(UIK);if(ui&&typeof ui==='object')Object.assign(prefs,ui);
  setUiLang(undefined,{boot:true});
  const ix=lsGet(IDXK);if(ix&&Array.isArray(ix.items))IDX=Object.assign({v:2,items:[],active:null},ix);
  let fixed=false,mg={migrated:[],failed:[]};
  try{mg=await migrateLegacy()}catch(e){}
  if(mg.migrated.length||mg.failed.length)fixed=true;
  retireLegacy();
  /* the index can fall out of step with the projects (a crash, a manual clean-up): rebuild it from what is stored */
  const why={},ids=new Set(Vault.keys(PRJK).map(k=>k.slice(PRJK.length)));
  IDX.items=IDX.items.filter(m=>{const ok=ids.has(m.id);if(!ok)fixed=true;return ok});
  ids.forEach(id=>{if(!IDX.items.some(m=>m.id===id)){const p=Docs.read(id,why);if(p){IDX.items.push(metaOf(p));fixed=true}}});
  if(IDX.v!==SCHEMA){IDX.v=SCHEMA;fixed=true}
  /* first run of version 2: the single script and snapshots of the old version become a script with versions */
  const old=lsGet('klapka.v1');
  if(old&&Array.isArray(old.b)&&old.b.length&&!IDX.migrated){
    IDX.migrated=true;fixed=true;
    const op=old.prefs||{},dp=docDefaults();
    DOCK_.forEach(k=>{if(op[k]!==undefined)dp[k]=op[k]});if(op.both&&!op.nums)dp.nums='both';
    if(!ui)['theme','nav','zoom','tw','recent'].forEach(k=>{if(op[k]!==undefined)prefs[k]=op[k]});
    const p=newProject({title:old.title||'Untitled script',blocks:old.b.filter(Array.isArray).map(([t,x])=>[ALL.includes(t)?t:'action',String(x)]),prefs:dp,raw:true});
    p.doc.title=old.title||'';persist(p);
    const sn=lsGet('klapka.snaps');
    if(Array.isArray(sn)&&sn.length){
      P=p;
      sn.slice().reverse().forEach(s=>{if(!s||!Array.isArray(s.b))return;
        const auto=!!s.auto,n=auto?0:++p.vseq;
        p.versions.unshift({id:uid()+uid(),n,name:auto?'Automatic':(s.name||'Version '+n),note:'',tag:'',lock:false,auto,t:s.t||Date.now(),title:s.title||'',f:FORMATS[s.f]?s.f:'eu',b:pack(s.b),w:wordsOf(s.b),sc:s.b.filter(x=>isHead(x[0])).length})});
      P=null;
    }
    migrateP(p);persist(p);
    IDX.active=p.id;
  }
  /* once: bring every stored script to the version-line model (nothing is dropped, see migrateP) */
  if(!IDX.vm){let ok=true;Vault.keys(PRJK).forEach(k=>{const id=k.slice(PRJK.length),proj=Docs.read(id);if(proj&&!view(proj).vl){migrateP(view(proj));if(!Docs.write(proj))ok=false}});if(ok){IDX.vm=1;fixed=true}}
  if(fixed)saveIdx();
  /* an empty shell first (also what the editor shows behind the home screen), then the last script */
  if(innerWidth<=820)prefs.nav=false;
  prefs.wm=normWm(prefs.wm);applyFormat();
  ed.replaceChildren(mk(F.def,''));
  tpScr=tpEl(true);tpBox.appendChild(tpScr);fillIcons();statsEl.onclick=limitDlg;statsEl.style.cursor='pointer';
  applyPrefs();layout();after();
  cur=ed.firstElementChild;cur.classList.add('cur');syncSeg();H=[snap()];hi=0;
  const act=IDX.items.find(m=>m.id===IDX.active&&!m.trashed);
  if(act){const p=Docs.read(act.id);if(p){loadProject(p);setTimeout(()=>{if(titleEl.value.trim())canvas.scrollTop=$('#tpWrap').offsetHeight},0)}}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{layout();after()});
  if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>relayout());
  if(!canWrite()||!prefs.resume)showHome();
  if(!prefs.toured)setTimeout(()=>{if(prefs.toured||dlg.classList.contains('open'))return;if(!prefs.ui&&!prefs.langAsked)openWelcome();else openTour(0)},700);
  else if(!matchMedia('(pointer: coarse)').matches){ed.focus({preventScroll:true});setCaret(ed.firstElementChild,0)}
  if(mg.migrated.length)toastAct('Scripts were updated to the new storage format. Your originals are kept as a backup.','OK',()=>{});
  if(mg.diskBad)toastAct(_('The copy on disk differs from the one in memory for: {n}',{n:mg.diskBad}),'OK',()=>{});
  if(why.newer)toastAct(_('Some scripts were made by a newer version of the app and were left untouched: {n}',{n:why.newer}),'OK',()=>{});
  if(why.bad)toastAct(_('Some stored scripts could not be read and were skipped: {n}',{n:why.bad}),'OK',()=>{});
  if(mg.failed.length)toastAct(_('These scripts could not be converted and were left untouched: {names}',{names:mg.failed.map(f=>f.title||f.id).join(', ')}),'OK',()=>{});
})();
})();
