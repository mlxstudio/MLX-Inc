[package]
name = "mlx-ink"
version = "0.1.2"
description = "MLX Ink"
edition = "2021"

[lib]
# The `_lib` suffix avoids a Windows-only name collision between the lib and bin outputs.
name = "mlx_ink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
